<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/user-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>결제 상세 확인</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <div>
                <table class="table">
                    <!-- Head Row -->
                    <thead>
                    <tr class="inline-text">
                        <th class="pro-id">주문 아이디</th>
                        <th class="pro-status">결제 상태</th>
                        <th class="pro-price">결제 가격</th>
                        <th class="pro-date">결제 날짜</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Product Row -->
                    <tr>
                        <td class="pro-id"><span
                                th:text="${paymentInfo.orderId()}"></span></td>
                        <td class="pro-status"><span
                                th:text="${paymentInfo.status()}"></span></td>
                        <td class="pro-price"><span
                                th:text="${paymentInfo.amount()}"></span></td>
                        <td class="pro-date"><span
                                th:text="${paymentInfo.date()}"></span></td>
                    </tr>
                    </tbody>
                </table>
                <a th:if="${paymentInfo.status() != '결제 취소' || orderStatus.equals('대기')}"
                   th:href="@{/api/payments/cancel/{order_info_id}(order_info_id=${paymentInfo.orderId()})}"
                   class="btn btn-primary">결제 취소</a>
                <a th:if="${paymentInfo.status() == 'READY' || paymentInfo.status() == 'EXPIRED' }"
                   th:href="@{/api/payments/{order_info_id}(order_info_id=${paymentInfo.orderId()})}"
                   class="btn btn-primary">결제 하기</a>
            </div>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
