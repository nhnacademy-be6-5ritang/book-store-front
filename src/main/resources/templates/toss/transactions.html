<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/favicon.ico}">
</head>


<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <section class="breadcrumb-section">
        <h2 class="sr-only">Site Breadcrumb</h2>
        <div class="container">
            <div class="breadcrumb-contents">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/api/categories/main}">홈</a></li>
                        <li class="breadcrumb-item active">결제 확인</li>
                    </ol>
                </nav>
            </div>
        </div>
    </section>

    <div class="page-section inner-page-sec-padding">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="row">
                        <!-- My Account Tab Menu Start -->
                        <div class="col-lg-3 col-12">
                            <!-- 관리자 계정 메뉴 -->
                            <div th:insert="~{fragments/user-account-menu.html}"></div>
                        </div>
                        <!-- My Account Tab Menu End -->
                        <!-- My Account Tab Content Start -->
                        <div class="col-lg-9 col-12 mt--30 mt-lg--0">
                            <div class="tab-content" id="myaccountContent">
                                <div class="cart_area inner-page-sec-padding-bottom">
                                    <div class="container">
                                        <div class="page-section-title">
                                            <h1>결제 상세 확인</h1>
                                        </div>
                                        <div>
                                            <table class="table">
                                                <!-- Head Row -->
                                                <thead>
                                                <tr>
                                                    <th class="pro-id">주문 아이디</th>
                                                    <th class="pro-name">주문 내용</th>
                                                    <th class="pro-provider">결제 방법</th>
                                                    <th class="pro-status">결제 상태</th>
                                                    <th class="pro-price">결제 가격</th>
                                                    <th class="pro-date">결제 날짜</th>
                                                </tr>
                                                </thead>
                                                <tbody>
                                                <!-- Product Row -->
                                                <tr>
                                                    <td class="pro-id"><span
                                                            th:text="${paymentInfo.orderId()}"></span></td>
                                                    <td class="pro-name"> <span
                                                            th:text="${paymentInfo.orderName()}"></span></td>
                                                    <td class="pro-provider"><span
                                                            th:text="${paymentInfo.provider()}"></span></td>
                                                    <td class="pro-status"><span
                                                            th:text="${paymentInfo.status()}"></span></td>
                                                    <td class="pro-price"><span
                                                            th:text="${paymentInfo.amount()}"></span></td>
                                                    <td class="pro-date"><span
                                                            th:text="${paymentInfo.date()}"></span></td>
                                                </tr>
                                                </tbody>
                                            </table>
                                            <a th:if="${paymentInfo.status() != 'CANCELED' || orderStatus.equals('대기')}"
                                               th:href="@{/api/payments/cancel/{order_info_id}(order_info_id=${paymentInfo.orderId()})}"
                                               class="btn btn-primary">결제 취소</a>
                                            <a th:if="${paymentInfo.status() == 'READY' || paymentInfo.status() == 'EXPIRED' }"
                                               th:href="@{/api/payments/{order_info_id}(order_info_id=${paymentInfo.orderId()})}"
                                               class="btn btn-primary">결제 하기</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
</body>

</html>
