<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/login/login.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>


<body>
<header th:insert="~{global/header}"></header>

<section id="login-section" class="top-container">
    <form class="login-form-container" action="/auth/login" method="post">
        <hr style="margin: 2rem 0; width: 30rem">
        <h5>휴면 해제</h5>
        <hr style="margin: 2rem 0; width: 30rem">
        <table class="login-input-table">
            <tr>
                <td>
                    <br/>
                </td>
            </tr>
            <tr>
                <td class="label-column">
                    <label for="email"><i class="fas fa-envelope"></i></label>
                </td>
                <td>
                    <input id="email" type="email" name="email" placeholder="이메일을 입력해주세요" required>
                </td>
                <td>
                    <button type="button" class="send-button" onclick="sendDormantEmail()">
                        인증번호
                    </button>
                </td>
            </tr>
            <tr>
                <td>
                    <br/>
                </td>
            </tr>
            <tr>
                <td class="label-column">
                    <label for="certify-code"><i class="fa-solid fa-key"></i></label>
                </td>
                <td>
                    <input id="certify-code" type="text" placeholder="인증번호를 입력해주세요" required>
                </td>
                <td>
                    <button type="button" class="verify-code" id="certify-code-button"
                            onclick="certifyDormantCode()">
                        인증확인
                    </button>
                </td>
            </tr>
            <tr>
                <td>
                    <br/>
                </td>
            </tr>
        </table>
    </form>
    <br/>
    <br/>
    <br/>
</section>

<br/>
<br/>
<br/>
<br/>

<footer th:insert="~{global/footer.html}"></footer>

<script th:src="@{/js/dormant-certify.js}"></script>
</body>

</html>
