<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>마이페이지</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/favicon.ico}">
</head>

<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <section class="breadcrumb-section">
        <h2 class="sr-only">Site Breadcrumb</h2>
        <div class="container">
            <div class="breadcrumb-contents">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/books/main}">홈</a></li>
                        <li class="breadcrumb-item active">마이 페이지</li>
                    </ol>
                </nav>
            </div>
        </div>
    </section>

    <div class="page-section inner-page-sec-padding">
        <div class="container" style="">
            <div class="row">
                <!-- My Account Tab Menu Start -->
                <div class="col-lg-3 col-12">
                    <!-- 사용자 계정 메뉴 -->
                    <div th:insert="~{fragments/user-account-menu.html}"></div>
                </div>
                <div class="col-lg-9 col-12">
                    <div>
                        <h5>마이 페이지</h5>
                        <div th:if="${myUserInfo.userStatusName == 'ACTIVE'}"
                             style="width: 7px; height: 7px; border-radius: 50%; background-color: #10a400"></div>
                        <div th:unless="${myUserInfo.userStatusName == 'ACTIVE'}"
                             style="width: 7px; height: 7px; border-radius: 50%; background-color: #a8a8a8"></div>
                    </div>
                    <table>
                        <tr>
                            <td>이름</td>
                            <td th:text="${myUserInfo.name}"></td>
                            <td>권한</td>
                            <td th:each="role : ${myUserInfo.roles}" th:text="${role}"></td>
                        </tr>
                        <tr>
                            <td th:text="${myUserInfo.userGradeName}"></td>
                            <td th:text="${myUserInfo.userStatusName}"></td>
                        </tr>
                        <tr>
                            <td>이메일</td>
                            <td th:text="${myUserInfo.email}"></td>
                            <td>
                                <button id="update-email-button" onclick="alert('아직 구현 중 ...')">이메일 변경</button>
                            </td>
                        </tr>
                        <tr>
                            <td>비밀번호</td>
                            <td>********</td>
                            <td>
                                <button id="update-password-button" onclick="alert('아직 구현 중 ...')">비밀번호 변경</button>
                            </td>
                        </tr>
                        <tr>
                            <td>연락처</td>
                            <td th:text="${myUserInfo.contact}"></td>
                        </tr>
                        <tr>
                            <td>내 주소</td>
                            <!--<td th:text="${myUserInfo.address}"></td>-->
                            <td>주소 구현 중...</td>
                            <td>
                                <button id="update-address-button" onclick="alert('아직 구현 중 ...')">주소 변경</button>
                            </td>
                        </tr>
                        <tr>
                            <td>가입일</td>
                            <td th:text="${myUserInfo.createdAt}"></td>
                        </tr>
                    </table>
                    <button id="update-info-button">정보수정</button>
                    <button id="dormant-button">회원탈퇴</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>

<script th:src="@{/js/my-page.js}"></script>
</body>

</html>
