<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/user/my-info.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/user-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <div style="height: 100%; display: grid; place-items: center;">
                <div th:if="${myUserInfo.userStatusName == 'ACTIVE'}"
                     style="width: 7px; height: 7px; border-radius: 50%; background-color: #007924"></div>
                <div th:if="${myUserInfo.userStatusName == 'DORMANT'}"
                     style="width: 7px; height: 7px; border-radius: 50%; background-color: #a8a8a8"></div>
            </div>
            <h5 style="margin: 0 1rem" th:text="${myUserInfo.name} + ' 님의 마이 페이지'"></h5>
            <div th:if="${myUserInfo.userStatusName == 'DORMANT'}">
                <button id="dormant-to-active-button" type="button"
                        th:data-email="${myUserInfo.email}">
                    휴면 해제
                </button>
                <div id="code-input-container" style="display: none">
                    <input id="certify-code" type="text" placeholder="인증번호를 입력해주세요" required>
                    <button type="button" class="verify-code" id="certify-code-button">
                        인증번호 확인
                    </button>
                </div>
            </div>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <span style="color: #797979" onmouseover="displayUserGrades()"
                  onmouseout="hideUserGrades()"
                  th:text="${myUserInfo.userGradeName} + ' ' + ${role}"></span>
            <table class="my-info-table">
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td class="table-label">총 주문 금액</td>
                    <td class="table-left-data">
                        <span th:text="${myTotalOrderPrice}"></span>
                        <span style="color: #797979">원</span>
                    </td>
                    <td class="table-label">포인트</td>
                    <td>
                        <span th:text="${myUserInfo.points}"></span>
                        <span style="font-weight:bold; color:#D90000;">P</span>
                    </td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td class="table-label">이메일</td>
                    <td class="table-left-data" th:text="${myUserInfo.email}"></td>
                    <td class="table-label">연락처</td>
                    <td th:text="${#strings.substring(myUserInfo.contact, 0, 3) + ' - ' +
                          #strings.substring(myUserInfo.contact, 3, 7) + ' - ' +
                          #strings.substring(myUserInfo.contact, 7)}"></td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td class="table-label">비밀번호</td>
                    <td class="table-left-data">********</td>
                    <td class="table-label">가입일</td>
                    <td th:text="${myUserInfo.createdAt.toString().split('T')[0].replaceAll('-', ' - ')}"></td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td class="table-label">생년월일</td>
                    <!--                    <td class="table-left-data">********</td>-->
                    <td class="table-left-data" th:text="${myUserInfo.birth.toString().replaceAll('-', ' - ')}">생년월일
                    </td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td class="table-label">내 주소</td>
                    <td style="display: flex">
                        <span th:if="${myAddress != null}"
                              th:text="${myAddress.baseAddress + ', ' + myAddress.detailAddress}"></span>
                        <a class="my-address-a" th:href="@{/addresses/my-address}">내 주소
                            관리</a>
                    </td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
                <tr>
                    <td><br/></td>
                </tr>
            </table>
            <div class="button-container">
                <button id="withdraw-button">회원탈퇴</button>
            </div>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
