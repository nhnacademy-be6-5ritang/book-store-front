<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">배송상태</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <h3>배송상태 리스트</h3>
            <h3><a th:href="@{/api/deliveryStatuses/create}" class="btn btn-primary">상태 추가</a></h3>
            <div th:if="${deliveryStatuses.size() > 0}">
                <table class="table table-bordered">
                    <thead>
                    <tr class="inline-text">
                        <th>번호</th>
                        <th>상태 이름</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="deliveryStatus, index : ${deliveryStatuses}">
                        <td th:text="${index.index + 1}">1</td>
                        <td th:text="${deliveryStatus.deliveryStatusName}">상태 이름</td>
                        <td style="display: flex; align-items: center;">
                            <a href="#"
                               th:href="@{/api/deliveryStatuses/update/{deliveryStatusId} (deliveryStatusId=${deliveryStatus.deliveryStatusId})}"
                               class="btn btn-warning inline-text">편집</a>
                            <form th:action="@{/api/deliveryStatuses/{deliveryStatusId}(deliveryStatusId=${deliveryStatus.deliveryStatusId})}"
                                  th:method="delete">
                                <button type="submit" class="btn btn-danger inline-text">
                                    삭제
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${deliveryStatuses.size() == 0}">
                <p>배송 상태가 없습니다.</p>
            </div>
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
