<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/user-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>배송내역</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <div th:if="${deliveries.getTotalElements() > 0}">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>배송상태</th>
                        <th>배송 수신 주소</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="delivery, index : ${deliveries}">
                        <td th:text="${index.index + 1}">1</td>
                        <td th:text="${delivery.deliveryStatusName}">배송 상태</td>
                        <td th:text="${delivery.deliveryReceiverAddress}">배송 수신 주소</td>
                        <td style="display: flex; align-items: center;">
                            <a th:href="@{/api/deliveries/delivery/{deliveryId} (deliveryId=${delivery.deliveryId})}"
                               class="btn btn-info inline-text">보기</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${deliveries.getTotalElements() < 1}">
                <p>배송 내역이 없습니다.</p>
            </div>
            <!-- 페이징 처리 시작-->
            <div th:insert="~{global/paging.html}"></div>
            <!-- 페이징 처리 끝-->
        </section>
    </section>
</section>

<div id="to-admin-container" class="top-container">
    <a th:href="@{/admin/users}">관리자이신가요?</a>
</div>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
