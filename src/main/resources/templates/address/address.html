<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>내 주소</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/favicon.ico}">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <section class="breadcrumb-section">
        <h2 class="sr-only">Site Breadcrumb</h2>
        <div class="container">
            <div class="breadcrumb-contents">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/books/main}">홈</a></li>
                        <li class="breadcrumb-item active">내 주소</li>
                    </ol>
                </nav>
            </div>
        </div>
    </section>

    <div class="page-section inner-page-sec-padding">
        <div class="container" style="">
            <div class="row">
                <!-- My Account Tab Menu Start -->
                <div class="col-lg-3 col-12">
                    <!-- 사용자 계정 메뉴 -->
                    <div th:insert="~{fragments/user-account-menu.html}"></div>
                </div>
                <div class="col-lg-9 col-12">
                    <div>
                        <h5>내 주소</h5>
                    </div>
                    <table>
                        <tr>
                            <td>-</td>
                            <td>주소</td>
                            <td>상세주소</td>
                            <td>-</td>
                            <td>-</td>
                        </tr>
                    </table>
                    <button type="button" data-bs-toggle="modal" data-bs-target="#addressModal">주소 추가</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addressModal" tabindex="-1" role="dialog" aria-labelledby="addressModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addressModalLabel">주소 추가</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addressForm">
                    <div class="form-group">
                        <input type="text" id="sample4_postcode" placeholder="우편번호" class="form-control">
                        <input type="button" onclick="sample4_execDaumPostcode()" value="우편번호 찾기"
                               class="btn btn-primary">
                    </div>
                    <div class="form-group">
                        <input type="text" id="sample4_roadAddress" placeholder="도로명주소" class="form-control">
                    </div>
                    <div class="form-group">
                        <input type="text" id="sample4_jibunAddress" placeholder="지번주소" class="form-control">
                    </div>
                    <div class="form-group">
                        <input type="text" id="sample4_detailAddress" placeholder="상세주소" class="form-control">
                    </div>
                    <div class="form-group">
                        <input type="text" id="sample4_extraAddress" placeholder="참고항목" class="form-control">
                    </div>
                    <span id="guide" style="color:#999;display:none"></span>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" id="saveAddressButton">저장</button>
            </div>
        </div>
    </div>
</div>

<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:src="@{/js/address.js}"></script>
</body>

</html>
