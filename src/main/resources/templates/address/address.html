<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/user/my-page.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/address/address.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>


<body>
<header th:insert="~{global/header}"></header>

<section id="my-page" class="top-container">
    <section id="my-page-menu-container" th:insert="~{fragments/user-menu.html}"></section>
    <section id="my-page-content">
        <section id="my-page-header">
            <h5>내 주소</h5>
        </section>
        <section id="my-page-body">
            <table class="address-table">
                <tr>
                    <th class="address-field">별칭</th>
                    <th class="address-field">주소</th>
                </tr>
                <tr class="address-row" th:each="address : ${myAddresses}" th:id="${address.id}"
                    th:classappend="${address.isDefault} == true ? 'default-address' : ''"
                    th:onclick="'confirmUpdateDefaultAddress(' + ${address.id} + ')'">
                    <td th:text="${address.alias}"></td>
                    <td th:text="${'[' + address.postCode + '] ' + address.baseAddress + ', ' + address.detailAddress}"></td>
                    <td class="address-field">
                        <button type="button" class="edit-button"
                                th:onclick="'openUpdateMdal(' + ${address.id} + '); event.stopPropagation();'">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </td>
                    <td class="address-field">
                        <button type="button" class="delete-button"
                                th:onclick="'deleteAddress(' + ${address.id} + '); event.stopPropagation();'">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            </table>
            <div class="button-container">
                <button type="button"
                        class="add_address-button"
                        onclick="if(checkAddressLimit()){
                                $('#addressModal').modal('show');
                            }">
                    주소 추가
                </button>
            </div>
        </section>
    </section>
</section>

<div class="modal fade" id="addressModal" tabindex="-1" role="dialog" aria-labelledby="addressModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addressModalLabel">주소 추가</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addressForm" action="/addresses" method="post">
                    <div class="form-group">
                        <input type="text" id="alias" name="alias" placeholder="별칭" class="form-control">
                    </div>
                    <div class="form-group" style="display: flex;">
                        <input type="text" id="postCode" name="postCode" placeholder="우편번호" class="form-control">
                        <input type="button" onclick="execDaumPostcode()" class="btn btn-primary" value="주소 찾기">
                    </div>
                    <div class="form-group">
                        <input type="text" id="baseAddress" name="baseAddress" placeholder="주소" class="form-control">
                    </div>
                    <div class="form-group">
                        <input type="text" id="detailAddress" name="detailAddress" placeholder="상세주소"
                               class="form-control">
                    </div>
                    <span id="guide" style="color:#999;display:none"></span>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                        <button type="submit" class="btn btn-primary" id="saveAddressButton">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="updateModal" tabindex="-1" role="dialog" aria-labelledby="updateModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="updateModalLabel">주소 수정</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="updateAddressForm" method="post">
                    <input type="hidden" id="updateAddressId" name="id">
                    <div class="form-group">
                        <input type="text" id="updateAlias" name="alias" placeholder="별칭" class="form-control">
                    </div>
                    <div class="form-group" style="display: flex;">
                        <input type="text" id="updatePostCode" name="postCode" placeholder="우편번호" class="form-control">
                        <input type="button" onclick="execDaumPostcode('updatePostCode', 'updateBaseAddress')"
                               class="btn btn-primary" value="주소 찾기">
                    </div>
                    <div class="form-group">
                        <input type="text" id="updateBaseAddress" name="baseAddress" placeholder="주소"
                               class="form-control">
                    </div>
                    <div class="form-group">
                        <input type="text" id="updateDetailAddress" name="detailAddress" placeholder="상세주소"
                               class="form-control">
                    </div>
                    <span id="updateGuide" style="color:#999;display:none"></span>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                        <button type="submit" class="btn btn-primary" id="saveUpdatedAddressButton">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>

<script th:inline="javascript">
    let myAddresses = /*[[${myAddresses}]]*/ [];
</script>

<script th:inline="javascript">
    /*<![CDATA[*/
    let responseMessage = /*[[${responseMessage != null ? responseMessage : ''}]]*/ '';
    /*]]>*/
</script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:src="@{/js/address.js}"></script>
</body>

</html>
