<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">도서상태</h5>
        </section>
        <section id="page-body">
            <h3><a th:href="@{/api/bookStatuses/create}" class="btn btn-primary">도서상태 추가</a></h3>
            <p>
            <div th:if="${bookStatuses.size() > 0}">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>도서상태 이름</th>
                        <td></td>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bookStatus, index : ${bookStatuses}">
                        <td th:text="${index.index + 1}">1</td>
                        <td th:text="${bookStatus.bookStatusName}">도서상태 이름</td>
                        <td style="display: flex; align-items: center;">
                            <a th:href="@{/api/bookStatuses/update/{bookStatusId} (bookStatusId=${bookStatus.bookStatusId})}"
                               class="btn btn-warning">편집</a>
                            <form th:action="@{/api/bookStatuses/{bookStatusId} (bookStatusId=${bookStatus.bookStatusId})}"
                                  th:method="delete">
                                <button type="submit" class="btn btn-danger">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${bookStatuses.size() == 0}">
                <p>도서상태가 없습니다.</p>
            </div>
            </p>
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
