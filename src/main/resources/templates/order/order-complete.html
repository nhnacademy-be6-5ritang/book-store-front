<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Use Minified Plugins Version For Fast Page Load -->
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/pages/wishlist.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
</head>

<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <section class="breadcrumb-section">
        <h2 class="sr-only">Site Breadcrumb</h2>
        <div class="container">
            <div class="breadcrumb-contents">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/api/books/main}">홈</a></li>
                        <li class="breadcrumb-item active">주문 완료</li>
                    </ol>
                </nav>
            </div>
        </div>

    </section>

    <!-- order complete Page Start -->
    <section class="order-complete inner-page-sec-padding-bottom">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="order-complete-message text-center">
                        <h1>Thank you !</h1>
                        <p>Your order has been received.</p>
                    </div>


                    <ul class="order-details-list">
                        <li>주문 번호: <strong><span
                                th:text="${bookOrder.orderInfoId()}"></span></strong></li>
                        <li>주문 날짜: <strong><span
                                th:text="${bookOrder.orderDate()}"></span></strong></li>
                        <li>총 가격: <strong><span
                                th:text="${bookOrder.totalPrice()}"></span></strong></li>
                    </ul>

                    <h3 class="order-table-title">주문 상품 내역</h3>
                    <div class="table-responsive">
                        <table class="table order-details-table">
                            <thead>
                            <tr>
                                <th>Product</th>
                                <th>Total</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td><strong><span
                                        th:text="${bookOrder.bookTitle()}"></span> × <span
                                        th:text="${bookOrder.quantity()}"></span> </strong>
                                </td>
                                <td><strong><span
                                        th:text="${bookOrder.totalPrice()}"></span></strong></td>
                            </tr>
                            </tbody>
                            <tfoot>
                            <tr>
                                <th>Total:</th>
                                <td><strong><span
                                        th:text="${bookOrder.totalPrice()}"></span></strong></td>
                            </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- order complete Page End -->
</div>
<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
</body>

</html>
