<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/user-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>주문 상세</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <div th:if="${order != null}" style="overflow-x: auto">
                <table class="table">
                    <thead>
                    <tr class="inline-text">
                        <th>주문 번호</th>
                        <th>결제자 이름</th>
                        <th>결제자 이메일</th>
                        <th>결제자 주소</th>
                        <th>주문 날짜</th>
                        <th>주문 상태</th>
                        <th>총 가격</th>
                        <th>결제 확인</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Product Row -->
                    <tr>
                        <td th:text="${order.infoId()}">
                        </td>
                        <td th:text="${order.payername()}"></td>
                        <td th:text="${order.payerEmail()}"></td>
                        <td th:text="${order.payerAddress()}"></td>
                        <td th:text="${order.orderDate()}"></td>
                        <td th:text="${order.status()}"></td>
                        <td th:text="${order.price().setScale(0)} + 원"></td>
                        <td>
                            <a th:href="@{/api/payments/transactions/{order_info_id}(order_info_id=${order.infoId()})}">
                                <button type="button">결제 정보 보기</button>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <table class="table">
                    <!-- Head Row -->
                    <thead>
                    <tr class="inline-text">
                        <th>수령인</th>
                        <th>주소</th>
                        <th>전화번호</th>
                        <th>배달 희망일</th>
                        <th>배달 상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Product Row -->
                    <tr>
                        <td> <span
                                th:text="${delivery.deliveryReceiver()}"></span></td>
                        <td><span
                                th:text="${delivery.deliveryReceiverAddress()}"></span></td>
                        <td><span
                                th:text="${delivery.deliveryReceiverPhone()}"></span></td>
                        <td><span
                                th:text="${delivery.deliveryReceiverDate()}"></span></td>
                        <td><span
                                th:text="${delivery.deliveryStatusName()}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${refundList} != null">
                <div th:each=" refund : ${refundList}" class="order-item">
                    <table class="table">
                        <!-- Head Row -->
                        <thead>
                        <tr>
                            <th class="pro-name">환불 기준</th>
                            <th class="pro-address">환불 기간</th>

                        </tr>
                        </thead>
                        <tbody>
                        <!-- Product Row -->
                        <tr>
                            <td class="pro-name"> <span
                                    th:text="${refund.refundPolicyContent()}"></span></td>
                            <td class="pro-address"><span>송신일 기준 [</span><span
                                    th:text=" ${refund.refundPolicyDate()}"></span><span> ] 일 이내에 환불이 가능합니다.</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <a th:href="@{/api/orders/refunding/{order_info_id}(order_info_id=${order.infoId()})}">
                    <button class="btn btn-primary">환불 요청</button>
                </a>
            </div>
            <div th:if="${order == null}">
                <p>주문 목록이 없습니다.</p>
            </div>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
