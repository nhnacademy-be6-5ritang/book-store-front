<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>관리자 주문 확인</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <div>
                <button onclick="location.href='/api/orders/admin/order-status/wait'"
                        class="btn btn-primary">
                    대기 주문 확인
                </button>
                <button onclick="location.href='/api/orders/admin/order-status/going'"
                        class="btn btn-primary">
                    발송 주문 확인
                </button>
                <button onclick="location.href='/api/orders/admin/order-status/complete'"
                        class="btn btn-primary">
                    완료 주문 확인
                </button>
                <button onclick="location.href='/api/orders/admin/order-status/refunding'"
                        class="btn btn-primary">
                    환불 중 주문 확인
                </button>
                <button onclick="location.href='/api/orders/admin/order-status/refunded'"
                        class="btn btn-primary">
                    환불 주문 확인
                </button>
                <button onclick="location.href='/api/orders/admin/refundPolicy'"
                        class="btn btn-primary">
                    환불 정책 관리
                </button>
            </div>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
