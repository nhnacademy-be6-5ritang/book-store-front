<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
</head>


<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <section class="breadcrumb-section">
        <h2 class="sr-only">Site Breadcrumb</h2>
        <div class="container">
            <div class="breadcrumb-contents">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/api/categories/main}">홈</a></li>
                        <li class="breadcrumb-item active">환불 정책 관리</li>
                    </ol>
                </nav>
            </div>
        </div>
    </section>

    <div class="page-section inner-page-sec-padding">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="row">
                        <!-- My Account Tab Menu Start -->
                        <div class="col-lg-3 col-12">
                            <!-- 관리자 계정 메뉴 -->
                            <div th:insert="~{fragments/admin-account-menu.html}"></div>
                        </div>
                        <!-- My Account Tab Menu End -->
                        <!-- My Account Tab Content Start -->
                        <div class="col-lg-9 col-12 mt--30 mt-lg--0">
                            <div class="tab-content" id="myaccountContent">
                                <div class="cart_area inner-page-sec-padding-bottom">
                                    <div class="container">
                                        <div class="page-section-title">
                                            <h1>환불 정책</h1>
                                        </div>
                                        <div th:if="${refundPolicy != null}">
                                            <div th:each="policy: ${refundPolicy.refunds()}">
                                                <table class="table">
                                                    <!-- Head Row -->
                                                    <thead>
                                                    <tr>
                                                        <th class="pro-id">환불 정책 아이디</th>
                                                        <th class="pro-content">환불 정책 내용</th>
                                                        <th class="pro-date">환불 기간 (~일 이내)</th>
                                                        <th class="pro-action">액션</th>
                                                    </tr>
                                                    </thead>
                                                    <tbody>
                                                    <!-- Product Row -->
                                                    <tr>
                                                        <td class="pro-id"> <span
                                                                th:text="${policy.refundPolicyId()}"></span></td>
                                                        <td class="pro-content"><span
                                                                th:text="${policy.refundPolicyContent()}"></span></td>
                                                        <td class="pro-date"><span
                                                                th:text="${policy.refundPolicyDate()}"></span></td>
                                                        <td class="pro-action">
                                                            <a th:href="@{/api/orders/admin/refundPolicy/{refundPolicyId}(refundPolicyId=${policy.refundPolicyId()})}">
                                                                <button class="btn btn-success">삭제</button>
                                                            </a>
                                                            <a th:href="@{/api/orders/admin/refundPolicy/update/{refundPolicyId}(refundPolicyId=${policy.refundPolicyId()})}">
                                                                <button class="btn btn-primary">수정</button>
                                                            </a>
                                                        </td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                        <div th:if="${refundPolicy == null}">
                                            <p>환불 정책이 없습니다.</p>
                                        </div>
                                        <a th:href="@{/api/orders/admin/refundPolicy/create}">
                                            <button class="btn btn-primary">새 환불 정책 생성</button>
                                        </a>
                                    </div>
                                </div>


                            </div>
                        </div>
                        <!-- My Account Tab Content End -->
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
</body>

</html>
