<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>주문상태</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <table class="table">
                <!-- Head Row -->
                <thead>
                <tr>
                    <th class="pro-id">주문 상태 이름</th>
                    <th class="pro-action">액션</th>
                </tr>
                </thead>
                <tbody>
                <!-- Product Row -->
                <tr th:each="list: ${orderStatus}">
                    <td class="pro-id"> <span
                            th:text="${list.orderStatusName()}"></span></td>
                    <td class="pro-action">
                        <a th:href="@{/api/orders/admin/order-status/{orderStatusId}(orderStatusId=${list.orderStatusId()})}">
                            <button class="btn btn-success">삭제</button>
                        </a>
                        <a th:href="@{/api/orders/admin/order-status/update/{orderStatusId}(orderStatusId=${list.orderStatusId()})}">
                            <button class="btn btn-primary">수정</button>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <a th:href="@{/api/orders/admin/order-status/create}">
                <button class="btn btn-primary">새 주문 상태 생성</button>
            </a>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
