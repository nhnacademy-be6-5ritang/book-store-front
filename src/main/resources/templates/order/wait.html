<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>관리자 주문 확인</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <div th:if="${orderList != null}">
                <table class="table">
                    <!-- Head Row -->
                    <thead>
                    <tr>
                        <th class="pro-title">주문 번호</th>
                        <th class="pro-price">주문 가격</th>
                        <th class="pro-date">주문 날짜</th>
                        <th class="pro-info">주문 보안 아이디</th>
                        <th class="pro-status">주문 상태</th>
                        <th class="pro-btn"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Product Row -->
                    <tr th:each="orders : ${orderList.orders()}" class="order-item">
                        <td class="pro-title">
                            <span th:text="${orders.orderId()}"></span>
                        </td>
                        <td class="pro-price"><span
                                th:text="${orders.orderPrice().setScale(0)} + 원"></span></td>
                        <td class="pro-date"><span
                                th:text="${orders.orderDate()}"></span></td>
                        <td class="pro-info"><span
                                th:text="${orders.orderInfoId()}"></span></td>
                        <td class="pro-status"><span
                                th:text="${orders.orderStatusName()}"></span></td>
                        <td>
                            <a th:href="@{/api/deliveries/{orderId}/sender(orderId=${orders.orderId()})}"
                               class="btn btn-primary">
                                배송 처리
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <a th:href="@{/api/orders/admin}" class="btn btn-primary"
                   style="margin-right: 20px;">
                    뒤로 가기
                </a>
            </div>
            <div th:if="${orderList == null}">
                <p>주문 목록이 없습니다.</p>
            </div>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>
<footer th:insert="~{global/footer}"></footer>
<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
