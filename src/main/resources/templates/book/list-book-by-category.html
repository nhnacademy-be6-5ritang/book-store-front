<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/pages/list-book-by-category.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/favicon.ico}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">


</head>

<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <!-- Book List Section -->
    <section class="page-section inner-page-sec-padding">
        <div class="container">
            <h2 class="sr-only">Book List Section</h2>

            <div class="row">
                <!-- Loop through books -->
                <div th:each="book : ${books}" class="col-lg-3 col-md-4 col-sm-6">
                    <div class="book-card">
                        <div class="book-header">
                            <h3><a th:href="@{/api/books/{bookId}(bookId=${book.bookId})}"
                                   th:text="${#strings.length(book.bookTitle) > 50 ? #strings.substring(book.bookTitle, 0, 50) + '...' : book.bookTitle}">제목
                                없음</a></h3>
                        </div>
                        <div class="book-image">
                            <img th:src="${book.bookImageUrl}"
                                 th:alt="${book.bookTitle}"
                                 th:href="@{/api/books/{bookId}(bookId=${book.bookId})}">
                            <div class="hover-contents">
                                <div class="hover-btns">
                                    <a th:attr="data-book-id=${book.bookId}"
                                       class="single-btn add-to-bookCart">
                                        <i class="fas fa-shopping-basket"></i>
                                    </a>
                                    <a th:attr="data-book-id=${book.bookId}"
                                       class="single-btn add-to-wishlist">
                                        <i class="fas fa-heart"></i>
                                    </a>
                                    <a th:href="@{/api/books/{bookId} (bookId=${book.bookId})}"
                                       class="single-btn">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="price-block">
                            <span class="price"
                                  th:text="${book.bookSalePrice} + '₩'">가격 정보 없음₩</span>
                            <del class="price-old" th:text="${book.bookPrice} + '₩'"></del>
                            <span class="price-discount"
                                  th:text="${book.bookSalePercent + '%'}">할인율 정보 없음</span>
                        </div>
                    </div>
                </div>
                <!-- End Loop -->
            </div>

            <!-- Paging Section -->
            <div th:insert="~{global/paging.html}"></div>
            <!-- End Paging Section -->
        </div>
    </section>
    <!-- End Book List Section -->

</div>
<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-wishList.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>
</body>

</html>
