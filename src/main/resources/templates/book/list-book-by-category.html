<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/favicon.ico}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Book Card Styles */
        .book-card {
            width: 100%;
            max-width: 100%;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            overflow: hidden;
            background-color: #fff;
        }

        .book-card .book-header {
            padding: 15px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ddd;
            min-height: 60px; /* 고정된 높이 설정 */
        }

        .book-card .book-header h3 {
            font-size: 16px;
            margin: 0;
            color: #333;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* 최대 2줄까지 표시 */
            -webkit-box-orient: vertical;
            text-overflow: ellipsis;
            max-width: calc(100% - 30px); /* 버튼 공간을 제외한 최대 너비 설정 */
            height: 60px; /* 고정된 높이 설정 */
        }

        .book-card .book-image {
            position: relative;
            overflow: hidden;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            height: 300px; /* 고정된 높이 설정 */
        }

        .book-card .book-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지가 잘리지 않고 채워지도록 설정 */
            display: block;
        }

        .book-card .book-image .hover-contents {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .book-card .book-image:hover .hover-contents {
            opacity: 1;
        }

        .book-card .hover-btns {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .book-card .hover-btns a {
            color: #fff;
            background-color: #333;
            padding: 10px;
            margin: 0 5px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .book-card .hover-btns a:hover {
            background-color: #ff3366;
        }

        .book-card .price-block {
            text-align: center;
            padding: 10px 15px;
            border-top: 1px solid #ddd;
        }

        .book-card .price,
        .book-card .price-old,
        .book-card .price-discount {
            display: block;
            font-size: 14px;
            color: #333;
        }

        /* Responsive Styles */
        @media (max-width: 1200px) {
            .container {
                padding: 0 15px;
            }
        }

        @media (max-width: 991px) {
            .book-card {
                width: calc(25% - 30px);
                margin: 0 15px 30px;
            }
        }

        @media (max-width: 767px) {
            .book-card {
                width: calc(50% - 30px);
                margin: 0 15px 30px;
            }
        }

        @media (max-width: 479px) {
            .book-card {
                width: calc(100% - 30px);
                margin: 0 15px 30px;
            }
        }
    </style>
</head>

<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <!-- Book List Section -->
    <section class="page-section inner-page-sec-padding">
        <div class="container">
            <h2 class="sr-only">Book List Section</h2>

            <div class="row">
                <!-- Loop through books -->
                <div th:each="book : ${books}" class="col-lg-3 col-md-4 col-sm-6">
                    <div class="book-card">
                        <div class="book-header">
                            <h3><a th:href="@{/api/books/{bookId}(bookId=${book.bookId})}"
                                   th:text="${#strings.length(book.bookTitle) > 50 ? #strings.substring(book.bookTitle, 0, 50) + '...' : book.bookTitle}">제목
                                없음</a></h3>
                        </div>
                        <div class="book-image">
                            <img th:src="${book.bookImageUrl}"
                                 th:alt="${book.bookTitle}"
                                 th:href="@{/api/books/{bookId}(bookId=${book.bookId})}">
                            <div class="hover-contents">
                                <div class="hover-btns">
                                    <a th:attr="data-book-id=${book.bookId}"
                                       class="single-btn add-to-bookCart">
                                        <i class="fas fa-shopping-basket"></i>
                                    </a>
                                    <a th:attr="data-book-id=${book.bookId}"
                                       class="single-btn add-to-wishlist">
                                        <i class="fas fa-heart"></i>
                                    </a>
                                    <a th:href="@{/api/books/{bookId} (bookId=${book.bookId})}"
                                       class="single-btn">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="price-block">
                            <span class="price"
                                  th:text="${book.bookSalePrice} + '₩'">가격 정보 없음₩</span>
                            <del class="price-old" th:text="${book.bookPrice} + '₩'"></del>
                            <span class="price-discount"
                                  th:text="${book.bookSalePercent + '%'}">할인율 정보 없음</span>
                        </div>
                    </div>
                </div>
                <!-- End Loop -->
            </div>

            <!-- Paging Section -->
            <div th:insert="~{global/paging.html}"></div>
            <!-- End Paging Section -->
        </div>
    </section>
    <!-- End Book List Section -->

</div>
<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-wishList.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>
</body>

</html>
