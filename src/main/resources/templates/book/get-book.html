<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/pages/list-review-by-book.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
</head>

<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <section class="breadcrumb-section">
        <h2 class="sr-only">Site Breadcrumb</h2>
        <div class="container">
            <div class="breadcrumb-contents">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/api/books/main}">홈</a></li>
                        <li class="breadcrumb-item active">도서 상세정보</li>
                    </ol>
                </nav>
            </div>
        </div>
    </section>

    <main class="inner-page-sec-padding-bottom">
        <div class="container">
            <div class="row  mb--60">
                <div class="col-lg-5 mb--30">
                    <!-- Product Details Slider Big Image-->
                    <div class="product-details-slider sb-slick-slider arrow-type-two"
                         data-slick-setting='{
                         "slidesToShow": 1,
                         "arrows": false,
                         "fade": true,
                         "draggable": false,
                         "swipe": false,
                         "asNavFor": ".product-slider-nav"
                         }'>
                        <div class="single-slide">
                            <img th:src="${book.bookImageUrl}" alt="">
                        </div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="product-details-info pl-lg--30 ">
                        <p class="tag-block">카테고리:
                            <span th:each="bookCategory : ${bookCategories}">
                                <a th:href="@{#}" th:text="${bookCategory.categoryName}"></a>&nbsp;
                            </span>
                        </p>

                        <h3 class="product-title" th:text="${book.bookTitle}"></h3>
                        <ul class="list-unstyled">
                            <li>작가: <a class="list-value font-weight-bold" th:text="${book.authorName}"></a></li>
                            <li>출판사: <a class="list-value font-weight-bold" th:text="${book.publisherName}"></a></li>
                            <li>출판일: <a class="list-value font-weight-bold"
                                        th:text="${#dates.format(book.bookPublishDate, 'yyyy-MM-dd')}"></a></li>
                            <li>ISBN: <span class="list-value" th:text="${book.bookIsbn}"></span></li>
                            <li>지급 포인트: <span class="list-value"> 200</span></li>
                            <li>상태: <span class="list-value" th:text="${book.bookStatusName}"></span></li>
                            <li>재고: <span class="list-value" th:text="${book.bookQuantity} + '권'"></span></li>
                        </ul>

                        <div>할인율: <span class="price-discount" th:text="${book.bookSalePercent + '%'}">할인율 정보 없음</span>
                        </div>

                        <div class="price-block">
                            할인가: <span class="price-new" th:text="${book.bookSalePrice} + '₩'"></span>
                            정가: <span class="price-old" th:text="${book.bookPrice} + '₩'"></span>
                        </div>

                        <p class="tag-block">태그:
                            <span th:each="bookTag : ${bookTags}">
                                <a th:href="@{#}" th:text="'#' + ${bookTag.tagName}"></a>&nbsp;
                            </span>
                        </p>
                        <div class="rating-widget">
                            <div class="rating-block">
                                <span th:each="reviewStar : ${#numbers.sequence(1, 5)}">
                                    <span th:if="${reviewStar <= reviewsAverageScore.intValue()}"
                                          class="fas fa-star star_on"></span>
                                    <span th:if="${reviewStar > reviewsAverageScore.intValue()}"
                                          class="fas fa-star"></span>
                                </span>
                            </div>
                            <div class="review-widget">
                                <a th:text=" ${reviewsAverageScore} + ' 점(' + ${reviews.getTotalElements()} + ' 개 리뷰) |'"></a>
                                <a th:href="@{/api/reviews/create/{bookId} (bookId=${book.bookId})}">리뷰 쓰기</a>
                            </div>
                        </div>
                        <div class="add-to-cart-row">
                            <div class="add-cart-btn">
                                <a th:attr="data-book-id=${book.bookId}"
                                   class="btn btn-outlined--primary add-to-bookCart"><span
                                        class="plus-icon">+</span>카트에 담기</a>
                                <a th:href="@{/api/orders/createBookOrderTest/{book_id}(book_id=${book.bookId()})}"
                                   class="btn btn-primary"><span class="plus-icon">+</span>주문하기</a>
                            </div>
                        </div>
                        <div class="compare-wishlist-row">
                            <a th:attr="data-book-id=${book.bookId}" class="add-to-wishlist"><i
                                    class="fas fa-heart"></i>위시리스트에 추가</a>
                        </div>
                    </div>
                </div>
            </div>


            <div>
                <h2>도서 설명</h2>
                <article class="review-article">
                    <h1 class="sr-only">Tab Article</h1>
                    <p th:text="${book.bookDescription}"></p>
                </article>

                <div class="sb-custom-tab review-tab section-padding">
                    <ul class="nav nav-tabs nav-style-2" id="myTab2" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="tab1" data-bs-toggle="tab" href="#tab-1" role="tab"
                               aria-controls="tab-1" aria-selected="true">전체 리뷰 (<span
                                    th:text="${reviews.getTotalElements()}"></span>)</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="tab2" data-bs-toggle="tab" href="#tab-2" role="tab"
                               aria-controls="tab-2" aria-selected="true">일반 리뷰 (<span
                                    th:text="${generalReviews.getTotalElements()}"></span>)</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="tab3" data-bs-toggle="tab" href="#tab-3" role="tab"
                               aria-controls="tab-2" aria-selected="true">포토 리뷰 (<span
                                    th:text="${photoReviews.getTotalElements()}"></span>)</a>
                        </li>
                    </ul>
                    <div class="tab-content space-db--20" id="myTabContent">
                        <div class="tab-pane fade show active" id="tab-1" role="tabpanel" aria-labelledby="tab1">
                            <div class="review-wrapper">
                                <div th:each="review : ${reviews}">
                                    <div class="review-comment">
                                        <div class="avatar">
                                            <img th:src="@{/image/icon/author-logo.png}" alt="Author Avatar">
                                        </div>
                                        <div class="text">
                                            <div class="rating-block mb--15">
                                                 <span th:each="reviewStar : ${#numbers.sequence(1, 5)}">
                                                     <span th:if="${reviewStar <= review.reviewScore}"
                                                           class="ion-android-star-outline star_on"></span>
                                                     <span th:if="${reviewStar > review.reviewScore}"
                                                           class="ion-android-star-outline"></span>
                                                 </span>
                                            </div>
                                            <h6 class="author">
                                                <span th:text="${review.userName}"></span> –
                                                <span class="font-weight-400"
                                                      th:text="${#temporals.format(review.reviewCreatedAt, 'yyyy-MM-dd')}"></span>
                                            </h6>
                                            <div class="review-content">
                                                <div><img th:if="${review.reviewImageUrl != null}"
                                                          th:src="${review.reviewImageUrl}" alt="리뷰 이미지"></div>
                                                <div class="review-text">
                                                    <p th:text="${review.reviewComment}"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 페이징 처리 시작-->
                            <div th:insert="~{global/paging.html}"></div>
                            <!-- 페이징 처리 끝-->
                        </div>

                        <div class="tab-pane fade" id="tab-2">
                            <div class="review-wrapper">
                                <div th:each="generalReview : ${generalReviews}">
                                    <div class="review-comment">
                                        <div class="avatar">
                                            <img th:src="@{/image/icon/author-logo.png}" alt="Author Avatar">
                                        </div>
                                        <div class="text">
                                            <div class="rating-block mb--15">
                                        <span th:each="reviewStar : ${#numbers.sequence(1, 5)}">
                                            <span th:if="${reviewStar <= generalReview.reviewScore}"
                                                  class="ion-android-star-outline star_on"></span>
                                            <span th:if="${reviewStar > generalReview.reviewScore}"
                                                  class="ion-android-star-outline"></span>
                                        </span>
                                            </div>
                                            <h6 class="author">
                                                <span th:text="${generalReview.userName}"></span> –
                                                <span class="font-weight-400"
                                                      th:text="${#temporals.format(generalReview.reviewCreatedAt, 'yyyy-MM-dd')}"></span>
                                            </h6>
                                            <div class="review-content">
                                                <div><img th:if="${generalReview.reviewImageUrl != null}"
                                                          th:src="${generalReview.reviewImageUrl}" alt="리뷰 이미지"></div>
                                                <div class="review-text">
                                                    <p th:text="${generalReview.reviewComment}"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 페이징 처리 시작-->
                            <div th:insert="~{global/paging.html}"></div>
                            <!-- 페이징 처리 끝-->
                        </div>

                        <div class="tab-pane fade" id="tab-3" role="tabpanel" aria-labelledby="tab3">
                            <div class="review-wrapper">
                                <div th:each="photoReview : ${photoReviews}">
                                    <div class="review-comment">
                                        <div class="avatar">
                                            <img th:src="@{/image/icon/author-logo.png}" alt="Author Avatar">
                                        </div>
                                        <div class="text">
                                            <div class="rating-block mb--15">
                                        <span th:each="reviewStar : ${#numbers.sequence(1, 5)}">
                                            <span th:if="${reviewStar <= photoReview.reviewScore}"
                                                  class="ion-android-star-outline star_on"></span>
                                            <span th:if="${reviewStar > photoReview.reviewScore}"
                                                  class="ion-android-star-outline"></span>
                                        </span>
                                            </div>
                                            <h6 class="author">
                                                <span th:text="${photoReview.userName}"></span> –
                                                <span class="font-weight-400"
                                                      th:text="${#temporals.format(photoReview.reviewCreatedAt, 'yyyy-MM-dd')}"></span>
                                            </h6>
                                            <div class="review-content">
                                                <div><img th:if="${photoReview.reviewImageUrl != null}"
                                                          th:src="${photoReview.reviewImageUrl}" alt="리뷰 이미지"></div>
                                                <div class="review-text">
                                                    <p th:text="${photoReview.reviewComment}"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 페이징 처리 시작-->
                            <div th:insert="~{global/paging.html}"></div>
                            <!-- 페이징 처리 끝-->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-wishList.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>
</body>

</html>
