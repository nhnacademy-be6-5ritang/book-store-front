<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/book/book.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<br/>

<section id="book-details" class="top-container">
    <div class="book-details-info">
        <div style="display: flex">
            <span style="color:#a8a8a8">카테고리&nbsp;&nbsp;&nbsp;>&nbsp;&nbsp;&nbsp;</span>
            <div th:each="bookCategory, iterStat : ${bookCategories}">
                <a class="category-a" th:href="@{/api/books/page/category(categoryName=${bookCategory.categoryName})}"
                   th:text="${bookCategory.categoryName}"></a>
                <span style="color:#a8a8a8" th:if="${!iterStat.last}">&nbsp;&nbsp;>&nbsp;&nbsp;&nbsp;</span>
            </div>
        </div>
        <div style="display: flex; justify-content: start">
            <span style="margin-right: 1rem; color:#a8a8a8" th:each="bookTag : ${bookTags}">
                <span th:text="'#' + ${bookTag.tagName}"></span>
            </span>
        </div>
        <div style="display: flex; align-items: center">
            <h3 id="book-title" th:text="${book.bookTitle}"></h3>
            <div style="margin-left: 2rem">
                <span style="font-size: 1.2rem;" th:each="reviewStar : ${#numbers.sequence(1, 5)}">
                    <i style="color: #797979" th:if="${reviewStar <= reviewsAverageScore.intValue()}"
                       class="fa-solid fa-star"></i>
                    <i style="color:#a8a8a8" th:if="${reviewStar > reviewsAverageScore.intValue()}"
                       class="fa-regular fa-star"></i>
                </span>
            </div>
            <span style="margin-left: 0.5rem; color: #797979"
                  th:text="${reviewsAverageScore} + '점'"></span>
            <a style="margin-left: 0.5rem; color: #797979; font-size: 0.85rem"
               th:text="'[' + ${reviews.getTotalElements()} + '리뷰]'"
               th:href="'#book-reviews'"></a>
        </div>
        <br/>
        <br/>
        <div class="info-table">
            <span class="table-label">작가</span>
            <span class="table-data" th:text="${book.authorName}"></span>
        </div>
        <br/>
        <br/>
        <div class="info-table two-data-columns">
            <div>
                <span class="table-label">ISBN</span>
                <span class="table-data" th:text="${book.bookIsbn}"></span>
            </div>
            <div>
                <span class="table-label">재고</span>
                <span class="table-data" th:text="${book.bookQuantity} + ' 권'"></span>
            </div>
        </div>
        <br/>
        <br/>
        <div class="info-table two-data-columns">
            <div>
                <span class="table-label">출판사</span>
                <span class="table-data" th:text="${book.publisherName}"></span>
            </div>
            <div>
                <span class="table-label">출판일</span>
                <span class="table-data" th:text="${#dates.format(book.bookPublishDate, 'yyyy년 M월 d일')}"></span>
            </div>
        </div>
        <br/>
        <br/>
        <div class="info-table two-data-columns">
            <div style="font-size: 12px;" th:if="${book.bookSalePercent != 0.00}">
                <span style="width: 80px; color: #a8a8a8; text-decoration: line-through;"
                      th:text="${#numbers.formatDecimal(book.bookPrice, 1, 'COMMA', 0, 'POINT') + ' 원'}"></span>
                <span style="width: 220px; color: #D90000; font-weight: bold"
                      th:text="${'-' + #numbers.formatDecimal(book.bookSalePercent, 1, 'COMMA', 0, 'POINT') + ' %'}"></span>
            </div>
            <div style="margin-right: 13.1rem" th:if="${book.bookSalePercent == 0.00}">
                <span class="table-data" style="font-size:1.3rem; font-weight: bold"
                      th:text="${#numbers.formatDecimal(book.bookSalePrice, 1, 'COMMA', 0, 'POINT')} + ' 원'"></span>
            </div>
            <div>
                <span class="table-label">포인트</span>
                <span style="color: #797979">+ 200</span>
                <span style="color: #D90000">P</span>
            </div>
        </div>
        <div class="info-table" th:if="${book.bookSalePercent != 0.00}">
            <div style="margin-right: 13.1rem">
                <span class="table-data" style="font-size:1.3rem; font-weight: bold"
                      th:text="${#numbers.formatDecimal(book.bookSalePrice, 1, 'COMMA', 0, 'POINT')} + ' 원'"></span>
            </div>
        </div>
        <br/>
        <br/>
        <br/>
        <div class="info-table" style="display: flex; justify-content: start; margin-left: 300px">
            <a th:attr="data-book-id=${book.bookId}" class="add-to-bookCart">
                <div class="book-menu-buttons" id="cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="menu-tag">장바구니</span>
                </div>
            </a>
            <a th:href="@{/api/orders/createBookOrderTest/{book_id}(book_id=${book.bookId()})}">
                <div class="book-menu-buttons" id="order">
                    <i class="fa-solid fa-circle-dollar-to-slot"></i>
                    <span class="menu-tag">바로 주문</span>
                </div>
            </a>
            <a th:attr="data-book-id=${book.bookId}" class="add-to-wishlist">
                <div class="book-menu-buttons" id="likes">
                    <i class="fa-solid fa-heart"></i>
                    <span class="menu-tag">좋아요</span>
                </div>
            </a>
        </div>
    </div>
    <div class="book-details-image-container">
        <img class="background-image" th:src="${book.bookImageUrl}" alt="">
        <img class="front-image" th:src="${book.bookImageUrl}" alt="">
    </div>
</section>

<div class="top-container">
    <hr style="margin: 4rem 0">
</div>

<section id="book-explanation" class="top-container">
    <p style="color: #a8a8a8; font-size: 1.2rem; font-weight: bold; text-align: center">상품 설명</p>
    <article class="review-article">
        <h1 class="sr-only">Tab Article</h1>
        <div th:utext="${book.bookDescription}"></div>
    </article>
</section>

<div class="top-container">
    <hr style="margin: 4rem 0">
</div>

<section id="book-reviews" class="top-container">
    <p style="color: #a8a8a8; font-size: 1.2rem; font-weight: bold; text-align: center"
       th:text="${reviewType} + '리뷰 (' + ${reviews.getTotalElements()} + ')'">리뷰</p>
    <div class="review-button-container">
        <a th:href="@{/api/books/{bookId} (bookId=${book.bookId}, reviewType='전체')}"
           class="btn btn-primary">전체리뷰 </a>
        <a th:href="@{/api/books/{bookId} (bookId=${book.bookId}, reviewType='일반')}"
           class="btn btn-primary">일반리뷰 </a>
        <a th:href="@{/api/books/{bookId} (bookId=${book.bookId}, reviewType='사진')}"
           class="btn btn-primary">사진리뷰 </a>
    </div>
    <div th:if="${reviews.getContent().size() == 0}" style="text-align: center">
        <span>등록된 리뷰가 없습니다.</span>
    </div>
    <div th:if="${reviews.size != 0}" th:each="review : ${reviews}" class="reviews-container">
        <div class="single-review">
            <div class="avatar-profile">
                <img th:src="@{/image/LEFT_REVIEW_AVATAR.png}" alt="avatar">
            </div>
            <div class="review-content">
                <div>
                    <span th:text="${review.userName} + ' 님의 리뷰'"></span>
                    <span style="color: #a8a8a8">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
                    <span th:text="${#temporals.format(review.reviewCreatedAt, 'yyyy-MM-dd')}"></span>
                    <br/>
                    <span style="font-size: 1.2rem;" th:each="reviewStar : ${#numbers.sequence(1, 5)}">
                        <i style="color: #797979" th:if="${reviewStar <= review.reviewScore}"
                           class="fa-solid fa-star"></i>
                        <i style="color:#a8a8a8" th:if="${reviewStar > review.reviewScore}"
                           class="fa-regular fa-star"></i>
                    </span>
                    <br/>
                    <div class="review-with-image" th:if="${review.reviewImageUrl != null}">
                        <span th:text="${review.reviewComment()}"></span>
                        <img th:if="${review.reviewImageUrl != null}"
                             th:src="${review.reviewImageUrl}" alt="리뷰 이미지">
                    </div>
                    <span th:if="${review.reviewImageUrl == null}" th:text="${review.reviewComment()}"></span>
                </div>
            </div>
        </div>
        <br/>
    </div>
    <!-- 페이징 처리 시작 -->
    <div th:insert="~{global/paging.html}"></div>
    <!-- 페이징 처리 끝 -->
</section>

<br/>
<br/>
<br/>
<br/>

<footer th:insert="~{global/footer.html}"></footer>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-wishList.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>
</body>

</html>
