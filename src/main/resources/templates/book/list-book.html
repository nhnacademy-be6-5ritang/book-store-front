<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/favicon.ico}">
</head>


<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <section class="breadcrumb-section">
        <h2 class="sr-only">Site Breadcrumb</h2>
        <div class="container">
            <div class="breadcrumb-contents">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/api/books/main}">홈</a></li>
                        <li class="breadcrumb-item active">도서 리스트</li>
                    </ol>
                </nav>
            </div>
        </div>
    </section>

    <div class="page-section inner-page-sec-padding">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="row">
                        <!-- My Account Tab Menu Start -->
                        <div class="col-lg-3 col-12">
                            <!-- 관리자 계정 메뉴 -->
                            <div th:insert="~{fragments/admin-account-menu.html}"></div>
                        </div>
                        <!-- My Account Tab Menu End -->
                        <!-- My Account Tab Content Start -->
                        <div class="col-lg-9 col-12 mt--30 mt-lg--0">
                            <div class="tab-content" id="myaccountContent">
                                <!-- 도서 Tab Content Start -->
                                <div class="tab-pane fade show active" id="delivery" role="tabpanel">
                                    <div class="myaccount-content">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <h3>도서</h3>

                                            <div class="form-group mb-0">
                                                <form th:action="@{/api/books/fetch}" method="post" class="d-flex">
                                                    <div class="input-group">
                                                        <label for="isbn" class="sr-only">추가할 책의 ISBN</label>
                                                        <input type="text" class="form-control" placeholder="ISBN 입력"
                                                               id="isbn" name="isbn" required>
                                                        <button type="submit" class="btn btn-primary">외부 API 도서 추가
                                                        </button>
                                                    </div>
                                                </form>
                                            </div>

                                            <a th:href="@{/api/books/create}" class="btn btn-primary">도서 추가</a>
                                        </div>
                                        <div th:if="${books.getContent().size() > 0}">
                                            <table class="table table-bordered">
                                                <thead>
                                                <tr class="inline-text">
                                                    <th>번호</th>
                                                    <th>도서 이름</th>
                                                    <th></th>
                                                </tr>
                                                </thead>
                                                <tbody>
                                                <tr th:each="book, index : ${books}">
                                                    <td th:text="${index.index + 1 + (pageable.pageNumber - 1) * pageable.pageSize}">
                                                        1
                                                    </td>
                                                    <td th:text="${book.bookTitle}">도서 이름</td>
                                                    <td style="display: flex; align-items: center;">
                                                        <a href="#"
                                                           th:href="@{/api/books/detail/{bookId} (bookId=${book.bookId})}"
                                                           class="btn btn-primary inline-text">보기</a>
                                                        <a href="#"
                                                           th:href="@{/api/books/update/{bookId} (bookId=${book.bookId})}"
                                                           class="btn btn-warning inline-text">편집</a>
                                                        <form th:action="@{/api/books/{bookId} (bookId=${book.bookId})}"
                                                              th:method="delete">
                                                            <button type="submit" class="btn btn-danger inline-text">
                                                                삭제
                                                            </button>
                                                        </form>
                                                    </td>
                                                </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div th:if="${books.getContent().size() == 0}">
                                            <p>도서가 없습니다.</p>
                                        </div>

                                        <!-- 페이징 처리 시작-->
                                        <div th:insert="~{global/paging.html}"></div>
                                        <!-- 페이징 처리 끝-->
                                    </div>
                                </div>
                                <!-- 도서 Tab Content End -->
                            </div>
                        </div>
                        <!-- My Account Tab Content End -->
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
</body>

</html>
