<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">도서</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <h3>도서 리스트</h3>
            <h3><a th:href="@{/api/books/create}" class="btn btn-primary">도서 추가</a></h3>
            <form th:action="@{/api/books/fetch}" method="post" class="d-flex">
                <div class="input-group">
                    <label for="isbn" class="sr-only">추가할 책의 ISBN</label>
                    <input type="text" class="form-control" placeholder="ISBN 입력"
                           id="isbn" name="isbn" required>
                    <button type="submit" class="btn btn-primary">외부 API 도서 추가
                    </button>
                </div>
            </form>

            <div th:if="${books.getContent().size() > 0}">
                <table class="table table-bordered">
                    <thead>
                    <tr class="inline-text">
                        <th>번호</th>
                        <th>도서 이름</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book, index : ${books}">
                        <td th:text="${index.index + 1 + (pageable.pageNumber - 1) * pageable.pageSize}">
                            1
                        </td>
                        <td th:text="${book.bookTitle}">도서 이름</td>
                        <td style="display: flex; align-items: center;">
                            <a href="#"
                               th:href="@{/api/books/detail/{bookId} (bookId=${book.bookId})}"
                               class="btn btn-primary inline-text">보기</a>
                            <a href="#"
                               th:href="@{/api/books/update/{bookId} (bookId=${book.bookId})}"
                               class="btn btn-warning inline-text">편집</a>
                            <form th:action="@{/api/books/{bookId} (bookId=${book.bookId})}"
                                  th:method="delete">
                                <button type="submit" class="btn btn-danger inline-text">
                                    삭제
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${books.getContent().size() == 0}">
                <p>도서가 없습니다.</p>
            </div>

            <!-- 페이징 처리 시작-->
            <div th:insert="~{global/paging.html}"></div>
            <!-- 페이징 처리 끝-->
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
