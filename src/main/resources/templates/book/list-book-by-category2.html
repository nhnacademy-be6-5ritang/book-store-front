<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/favicon.ico}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <!--=================================
        Home Slider Tab: Featured Product, New Arrivals, Most View Products 책 리스트
        ===================================== -->
    <div class="page-section inner-page-sec-padding">
        <div class="container">
            <section class="section-padding">
                <h2 class="sr-only">Home Tab Slider Section</h2>

                <div class="container">
                    <!-- 도서 리스트 시작-->
                    <div class="product-slider multiple-row  slider-border-multiple-row  sb-slick-slider"
                         data-slick-setting='{
                            "slidesToShow": 4,
                            "rows":2,
                            "dots":false
                        }' data-slick-responsive='[
                            {"breakpoint":1200, "settings": {"slidesToShow": 3} },
                            {"breakpoint":768, "settings": {"slidesToShow": 2} },
                            {"breakpoint":480, "settings": {"slidesToShow": 1} },
                            {"breakpoint":320, "settings": {"slidesToShow": 1} }
                        ]'>

                        <!-- 도서 정보 시작 -->
                        <div th:each="book : ${books}" class="book-list">
                            <div class="single-slide">
                                <div class="product-card">
                                    <div class="product-header">
                                        <h3><a th:href="@{/api/books/{bookId}(bookId=${book.bookId})}"
                                               th:text="${book.bookTitle}">제목 없음</a></h3>
                                    </div>
                                    <div class="product-card--body">
                                        <div class="card-image">
                                            <!-- 이미지 경로 설정 -->
                                            <img th:src="${book.bookImageUrl}"
                                                 th:alt="${book.bookTitle}"
                                                 th:href="@{/api/books/{bookId}(bookId=${book.bookId})}">
                                            <div class="hover-contents">
                                                <a th:href="@{/api/books/{bookId}(bookId=${book.bookId})}"
                                                   class="hover-image">
                                                    <img th:src="${book.bookImageUrl}"
                                                         th:alt="${book.bookTitle}">
                                                </a>
                                                <!-- 메인 간편 버튼 시작-->
                                                <div class="hover-btns">
                                                    <a th:attr="data-book-id=${book.bookId}"
                                                       class="single-btn add-to-bookCart">
                                                        <i class="fas fa-shopping-basket"></i>
                                                    </a>
                                                    <a th:attr="data-book-id=${book.bookId}"
                                                       class="single-btn add-to-wishlist">
                                                        <i class="fas fa-heart"></i>
                                                    </a>
                                                    <a th:href="@{/api/books/{bookId} (bookId=${book.bookId})}"
                                                       class="single-btn">
                                                        <i class="fas fa-eye"></i>
                                                    </a>
                                                </div>
                                                <!-- 메인 간편 버튼 끝-->
                                            </div>
                                        </div>
                                        <div class="price-block">
                                            <!-- 가격 정보 설정 -->
                                            <span class="price"
                                                  th:text="${book.bookSalePrice} + '₩'">가격 정보 없음₩</span>
                                            <del class="price-old" th:text="${book.bookPrice} + '₩'"></del>
                                            <span class="price-discount"
                                                  th:text="${book.bookSalePercent + '%'}">할인율 정보 없음</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- 도서 정보 종료 -->
                    </div>

                    <!-- 페이징 처리 시작-->
                    <div th:insert="~{global/paging.html}"></div>
                    <!-- 페이징 처리 끝-->

                    <!-- 도서 리스트 끝-->
                </div>
            </section>
            <!--=================================
            Home Features Section
            ===================================== -->
            <section class="mb--30">
                <div class="container">
                    <div class="row">
                        <div class="col-xl-3 col-md-6 mt--30">
                            <div class="feature-box h-100">
                                <div class="icon">
                                    <i class="fas fa-shipping-fast"></i>
                                </div>
                                <div class="text">
                                    <h5>Free Shipping Item</h5>
                                    <p> Orders over $500</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mt--30">
                            <div class="feature-box h-100">
                                <div class="icon">
                                    <i class="fas fa-redo-alt"></i>
                                </div>
                                <div class="text">
                                    <h5>Money Back Guarantee</h5>
                                    <p>100% money back</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mt--30">
                            <div class="feature-box h-100">
                                <div class="icon">
                                    <i class="fas fa-piggy-bank"></i>
                                </div>
                                <div class="text">
                                    <h5>Cash On Delivery</h5>
                                    <p>Lorem ipsum dolor amet</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mt--30">
                            <div class="feature-box h-100">
                                <div class="icon">
                                    <i class="fas fa-life-ring"></i>
                                </div>
                                <div class="text">
                                    <h5>Help & Support</h5>
                                    <p>Call us : + 0123.4567.89</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer.html}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-wishList.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>
</body>

</html>
