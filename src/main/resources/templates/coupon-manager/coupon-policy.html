<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>쿠폰정책 추가 페이지</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/pages/coupon-policy.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}"/>

</head>
<body>
<!--=================================
   Header Area
   ===================================== -->

<div th:insert="~{global/header}"></div>
<div class="container">

    <main class="page-section inner-page-sec-padding-bottom">
        <div class="row">
            <div class="col-sm-12 col-md-12 col-xs-12 col-lg-6 mb--30 mb-lg--0">
                <!-- Create Coupon Policy Form -->
                <form action="/coupons/policies" method="post">
                    <div class="form-group">
                        <h4 class="form-title">쿠폰 정책 발행 페이지</h4>
                        <label for="minOrderPrice">최소 주문금액</label>
                        <input type="text" class="form-control" id="minOrderPrice" name="minOrderPrice" required>
                        <label for="salePrice">할인 금액</label>
                        <input type="text" class="form-control" id="salePrice" name="salePrice" placeholder="할인율, 최대할인가격과 같이 사용할 수 없습니다">
                        <label for="saleRate">할인율</label>
                        <input type="text" class="form-control" id="saleRate" name="saleRate" placeholder="할인 금액과 같이 사용 할 수 없습니다">
                        <label for="maxSalePrice">최대 할인가격</label>
                        <input type="text" class="form-control" id="maxSalePrice" name="maxSalePrice" required>
                        <label for="type">타입</label>
                        <select class="form-control" id="type" name="type" required onchange="showFields(this.value)">
                            <option value="">쿠폰타입을 선택해 주세요</option>
                            <option value="welcome">가입쿠폰</option>
                            <option value="birthday">생일쿠폰</option>
                            <option value="book">도서쿠폰</option>
                            <option value="category">카테고리쿠폰</option>
                            <option value="sale">할인쿠폰</option>
                        </select>
                        <!-- Additional Fields for Books and Categories -->

                        <button type="submit" class="btn btn-primary mt-2">생성</button>
                        <div id="bookFields" style="display: none;">
                            <label for="bookSearch">도서 검색</label>
                            <input type="text" class="form-control" id="bookSearch" name="bookSearch">
                            <div id="bookSearchResults" class="search-results"></div>
                            <label for="bookTitle">도서 제목</label>
                            <input type="text" class="form-control" id="bookTitle" name="bookTitle" readonly>
                            <input type="hidden" id="bookId" name="bookId">
                        </div>

                        <div id="categoryFields" style="display: none;">
                            <label for="categorySearch">카테고리 검색</label>
                            <input type="text" class="form-control" id="categorySearch" name="categorySearch">
                            <div id="categorySearchResults" class="search-results"></div>
                            <label for="categoryName">카테고리 이름</label>
                            <input type="text" class="form-control" id="categoryName" name="categoryName" readonly>
                            <input type="hidden" id="categoryId" name="categoryId">
                        </div>


                    </div>
                </form>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12">
                <!-- Display Coupon Policies -->
                <h4>쿠폰 정책목록</h4>
                <table id="couponTable" class="table table-bordered">
                    <thead>
                    <tr>
                        <th>최소 주문금액</th>
                        <th>할인 금액</th>
                        <th>할인률</th>
                        <th>최대 할인금액</th>
                        <th>쿠폰 타입</th>
                        <th>정책 사용여부</th>
                        <th>카테고리 이름</th>
                        <th>도서 제목</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Loop through coupon policies and display each policy -->
                    <tr th:each="policy : ${policies}" id="policy-row">
                        <input type="hidden" class="form-control couponPolicyId" th:value="${policy.id}"/>
                        <input type="hidden" class="form-control minOrderPriceHidden" th:value="${policy.minOrderPrice}"/>
                        <input type="hidden" class="form-control salePriceHidden" th:value="${policy.salePrice}"/>
                        <input type="hidden" class="form-control saleRateHidden" th:value="${policy.saleRate}"/>
                        <input type="hidden" class="form-control maxSalePriceHidden" th:value="${policy.maxSalePrice}"/>
                        <input type="hidden" class="form-control typeHidden" th:value="${policy.type}"/>
                        <input type="hidden" class="form-control isUsedHidden" th:value="${policy.isUsed}"/>
                        <input type="hidden" class="form-control categoryNameHidden" th:value="${policy.categoryName}"/>
                        <input type="hidden" class="form-control bookTitleHidden" th:value="${policy.bookTitle}"/>
                        <td><input type="text" class="form-control minOrderPrice" th:value="${#numbers.formatDecimal(policy.minOrderPrice, 1, 'COMMA', 0, 'POINT')}"></td>
                        <td><input type="text" class="form-control salePrice" th:value="${policy.salePrice != null ? #numbers.formatDecimal(policy.salePrice, 1, 'COMMA', 0, 'POINT') : ''}"></td>
                        <td><input type="text" class="form-control saleRate" th:value="${policy.saleRate != null ? #numbers.formatDecimal(policy.saleRate * 100, 1, 'COMMA', 0, 'POINT') + '%': ''}"></td>
                        <td><input type="text" class="form-control maxSalePrice" th:value="${policy.maxSalePrice != null ? #numbers.formatDecimal(policy.maxSalePrice, 1, 'COMMA', 0, 'POINT') : ''}"></td>
                        <td><input type="text" class="form-control type" th:value="${policy.type}" readonly></td>
                        <td><input type="text" class="form-control isUsed" th:value="${policy.isUsed ? '사용' : '폐기'}" readonly></td>
                        <td><input type="text" class="form-control categoryName" th:value="${policy.categoryName != null ? policy.categoryName : '-'}" readonly></td>
                        <td><input type="text" class="form-control bookTitle" th:value="${policy.bookTitle != null ? policy.bookTitle : '-'}" readonly></td>
                        <td>
                            <div class="btn-group" role="group">
                                <button class="btn btn-primary btn-sm editBtn"
                                        th:data-policy-id="${policy.id}" th:data-is-used="${policy.isUsed}">쿠폰정책 변경
                                </button>
                                <button class="btn btn-success btn-sm addBtn" th:data-policy-id="${policy.id}"
                                        data-toggle="modal" data-target="#addCouponModal"
                                        th:if="${policy.isUsed and (policy.type == 'sale' or policy.type == 'book' or policy.type == 'category')}">
                                    쿠폰 템플릿 발행
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>

                </table>
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center mt-4">
                        <!-- 첫번째 페이지로 이동 -->
                        <li class="page-item" th:classappend="${policies.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/coupons/policies(page=1, size=${policies.size})}"
                               aria-label="First">
                                <span aria-hidden="true">&laquo; First</span>
                            </a>
                        </li>


                        <li class="page-item" th:classappend="${policies.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="${policies.first} ? '#' : '/coupons/policies?page=' + ${policies.number}+'&size='+${policies.size}"
                               aria-label="Previous">
                                <span aria-hidden="true">&lsaquo; Previous</span>
                            </a>
                        </li>

                        <!-- 페이지 번호 링크 -->
                        <li class="page-item" th:each="page: ${#numbers.sequence(startPage, endPage)}"
                            th:classappend="${page == policies.number + 1} ? 'active'">
                            <a class="page-link" th:href="@{/coupons/policies(page=${page}, size=${policies.size})}"
                               th:text="${page}"></a>
                        </li>

                        <!-- 다음 페이지로 이동  둘다 가능한 방법 -->
                        <li class="page-item" th:classappend="${policies.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="${policies.last} ? '#' : '/coupons/policies?page=' + (${policies.number} + 2)+'&size='+${policies.size}"
                               aria-label="Next">
                                <span aria-hidden="true">Next &rsaquo;</span>
                            </a>
                        </li>

                        <!-- 마지막 페이지로 이동 -->
                        <li class="page-item" th:classappend="${policies.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/coupons/policies(page=${policies.totalPages}, size=${policies.size})}"
                               aria-label="Last">
                                <span aria-hidden="true">Last &raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>

            </div>

        </div>
    </main>
</div>
<!--=================================
            Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>


<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="editCouponForm" action="" method="post">
                <input type="hidden" name="_method" value="patch">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">쿠폰정책 변경</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="policyIdEdit">쿠폰 정책 아이디</label>
                        <input type="text" class="form-control" id="policyIdEdit" name="couponPolicyId" readonly/>
                    </div>
                    <div class="form-group">
                        <label for="minOrderPriceEdit">최소 주문금액</label>
                        <input type="text" class="form-control" id="minOrderPriceEdit" name="minOrderPrice" required>
                    </div>
                    <div class="form-group">
                        <label for="salePriceEdit">할인 금액</label>
                        <input type="text" class="form-control" id="salePriceEdit" name="salePrice" placeholder="할인율, 최대할인가격과 같이 사용할 수 없습니다">
                    </div>
                    <div class="form-group">
                        <label for="saleRateEdit">할인률</label>
                        <input type="text" class="form-control" id="saleRateEdit" name="saleRate" placeholder="할인 금액과 같이 사용 할 수 없습니다">
                    </div>
                    <div class="form-group">
                        <label for="maxSalePriceEdit">최대 할인금액</label>
                        <input type="text" class="form-control" id="maxSalePriceEdit" name="maxSalePrice" required>
                    </div>
                    <div class="form-group">
                        <label for="typeEdit">쿠폰 타입</label>
                        <input type="text" class="form-control" id="typeEdit" name="type" readonly>
                    </div>
                    <div class="form-group">
                        <label>정책 사용여부</label><br>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="isUsedTrue" name="isUsed" value="true"
                                   required>
                            <label class="form-check-label" for="isUsedTrue">사용</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="isUsedFalse" name="isUsed" value="false">
                            <label class="form-check-label" for="isUsedFalse">폐기</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="categoryNameEdit">카테고리 이름</label>
                        <input type="text" class="form-control" id="categoryNameEdit" name="categoryName" readonly>
                    </div>
                    <div class="form-group">
                        <label for="bookTitleEdit">도서 제목</label>
                        <input type="text" class="form-control" id="bookTitleEdit" name="bookTitle" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
                    <button type="submit" class="btn btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>
</div>


<!-- Add Coupon Modal -->
<div class="modal fade" id="addCouponModal" tabindex="-1" role="dialog" aria-labelledby="addCouponModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="addCouponForm" action="/coupons" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCouponModalLabel">쿠폰 템플릿 발행</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="couponPolicyId">쿠폰 정책 아이디</label>
                        <input type="text" class="form-control" id="couponPolicyId" name="couponPolicyId">
                    </div>
                    <div class="form-group">
                        <label for="expiredDate">쿠폰 만료일</label>
                        <input type="datetime-local" class="form-control" id="expiredDate" name="expiredDate">
                    </div>
                    <div class="form-group">
                        <label for="issueDate">쿠폰 발행일</label>
                        <input type="datetime-local" class="form-control" id="issueDate" name="issueDate" readonly>
                    </div>
                    <div class="form-group">
                        <label for="quantity">쿠폰 수량</label>
                        <input type="number" class="form-control" id="quantity" name="quantity">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
                    <button type="submit" class="btn btn-primary">쿠폰 템플릿 발행</button>
                </div>
            </form>
        </div>
    </div>
</div>


<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>


<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-couponpolicy.js}"></script>

</body>
</html>
