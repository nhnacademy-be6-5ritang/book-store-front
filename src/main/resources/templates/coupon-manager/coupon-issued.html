<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>유저가발행한 쿠폰-관리자</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}"/>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <style>
        /* 테이블 컨테이너 스타일 */
        .table-container {
            width: 100%;
            overflow-x: auto; /* 스크롤바 추가 */
            margin: 0 auto;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* 테이블 전체 디자인 */
        .table {
            width: 150%;
            border-collapse: collapse;
            background-color: #f8f9fa;
        }

        /* 테이블 헤더 디자인 */
        .table thead th {
            background-color: #343a40;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            font-size: 16px;
        }

        /* 테이블 바디 디자인 */
        .table tbody td {
            border: 1px solid #343a40;
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }

        /* 테이블 테두리 디자인 */
        .table {
            border: 1px solid #343a40;
        }
        .table-bordered th, .table-bordered td {
            border: 1px solid #343a40;
        }

        /* 각 행의 교차 색상 */
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #e9ecef;
        }
        .table-striped tbody tr:nth-of-type(even) {
            background-color: #ffffff;
        }

        /* 테이블 헤더 및 셀 스타일 */
        .table th, .table td {
            border: 1px solid #343a40;
            padding: 12px;
        }

        /* 테이블 셀 크기 조정 */
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }

        /* 각 열의 너비 설정 */
        .table th:nth-child(1), .table td:nth-child(1) { width: 8%; }
        .table th:nth-child(2), .table td:nth-child(2) { width: 8%; }
        .table th:nth-child(3), .table td:nth-child(3) { width: 10%; }
        .table th:nth-child(4), .table td:nth-child(4) { width: 10%; }
        .table th:nth-child(5), .table td:nth-child(5) { width: 10%; }
        .table th:nth-child(6), .table td:nth-child(6) { width: 10%; }
        .table th:nth-child(7), .table td:nth-child(7) { width: 5%; }
        .table th:nth-child(8), .table td:nth-child(8) { width: 10%; }
        .table th:nth-child(9), .table td:nth-child(9) { width: 10%; }
        .table th:nth-child(10), .table td:nth-child(10) { width: 3%; }
        .table th:nth-child(11), .table td:nth-child(11) { width: 3%; }
        .table th:nth-child(12), .table td:nth-child(12) { width: 20%; }
        .table th:nth-child(13), .table td:nth-child(13) { width: 25%; }
        .table th:nth-child(14), .table td:nth-child(14) { width: 25%; }

        /* 전체 너비 조정 */
        .table-container {
            max-width: 100%;
            overflow-x: auto;
        }
    </style>

</head>
<body>

<!--=================================
   Header Area
   ===================================== -->

<header th:insert="~{global/header}"></header>




<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">사용자 쿠폰관리 페이지</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <!-- Search and Filter Form -->
            <form th:action="@{/coupons/users}" method="get" class="mb-4">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" class="form-control" name="userId" placeholder="유저아이디를 검색하세요" th:value="${param.userId}">
                    </div>
                    <div class="form-group">
                        <select class="form-control" name="type">
                            <option value="" >모든 타입</option>
                            <option value="welcome" th:selected="${#strings.equals(param.type, 'welcome')}">웰컴쿠폰</option>
                            <option value="birthday" th:selected="${#strings.equals(param.type, 'birthday')}">생일쿠폰</option>
                            <option value="book" th:selected="${#strings.equals(param.type, 'book')}">도서쿠폰</option>
                            <option value="category" th:selected="${#strings.equals(param.type, 'category')}">카테고리쿠폰</option>
                            <option value="sale" th:selected="${#strings.equals(param.type, 'sale')}">세일쿠폰</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary w-100">Search</button>
                    </div>

                </div>
            </form>



            <div th:if="${not #lists.isEmpty(userAndCoupon)}">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>유저 아이디</th>
                        <th>쿠폰아이디</th>
                        <th>쿠폰 타입</th>
                        <th>카테고리 이름</th>
                        <th>도서 제목</th>
                        <th>할인 금액</th>
                        <th>할인율</th>
                        <th>최대 할인금액</th>
                        <th>최소 주문금액</th>
                        <th>정책 사용 여부</th>
                        <th>쿠폰 사용 여부</th>
                        <th>쿠폰 발행일</th>
                        <th>쿠폰 만료일</th>
                        <th>쿠폰 사용일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Iterate over each UserAndCouponResponseDTO -->
                    <tr th:each="coupon : ${userAndCoupon}">
                        <td>
                            <span th:if="${coupon.userId != null}" th:text="${coupon.userId}"></span>
                            <span th:unless="${coupon.userId != null}">-</span>
                        </td>
                        <td>
                            <span th:if="${coupon.id != null}" th:text="${coupon.id}"></span>
                            <span th:unless="${coupon.id != null}">-</span>
                        </td>
                        <td>
                            <span th:if="${coupon.type != null}" th:text="${coupon.type}"></span>
                            <span th:unless="${coupon.type != null}">-</span>
                        </td>
                        <td>
                            <div th:if="${coupon.type == 'category'}">
                                <span th:if="${coupon.categoryName != null}" th:text="${coupon.categoryName}"></span>
                            </div>
                            <div th:unless="${coupon.type== 'category'}">-</div>
                        </td>
                        <td>
                            <div th:if="${coupon.type == 'book'}">
                                <span th:if="${coupon.bookTitle != null}" th:text="${coupon.bookTitle}"></span>
                            </div>
                            <div th:unless="${coupon.type== 'book'}">-</div>
                        </td>
                        <td>
                            <span th:if="${coupon.salePrice != null}" th:text="${#numbers.formatDecimal(coupon.salePrice, 1, 'COMMA', 0, 'POINT')+'원'}"></span>
                            <span th:unless="${coupon.salePrice != null}">-</span>
                        </td>
                        <td>
                                <span th:if="${coupon.saleRate != null}" th:text="${#numbers.formatDecimal(coupon.saleRate * 100, 1, 'COMMA', 0, 'POINT')+ '%'}"></span>
                                <span th:unless="${coupon.saleRate != null}">-</span>
                        </td>
                        <td>
                                <span th:if="${coupon.maxSalePrice != null}" th:text="${#numbers.formatDecimal(coupon.maxSalePrice, 1, 'COMMA', 0, 'POINT')+'원'}"></span>
                                <span th:unless="${coupon.maxSalePrice != null}">-</span>
                        </td>
                        <td>
                            <span th:if="${coupon.minOrderPrice != null}" th:text="${#numbers.formatDecimal(coupon.minOrderPrice, 1, 'COMMA', 0, 'POINT')+'원'}"></span>
                            <span th:unless="${coupon.minOrderPrice != null}">-</span>
                        </td>
                        <td>
                            <span th:if="${coupon.policyIsUsed != null}" th:text="${coupon.policyIsUsed ? '사용함' : '사용 안 함'}"></span>
                            <span th:unless="${coupon.policyIsUsed != null}">-</span>
                        </td>
                        <td>
                            <span th:if="${coupon.isUsed != null}" th:text="${coupon.isUsed ? '사용함' : '사용 안 함'}"></span>
                            <span th:unless="${coupon.isUsed != null}">-</span>
                        </td>
                        <td>
                            <span th:if="${coupon.issueDate != null}" th:text="${#temporals.format(coupon.issueDate, 'yyyy.MM.dd HH:mm')}"></span>
                            <span th:unless="${coupon.issueDate != null}">-</span>
                        </td>
                        <td>
                            <span th:if="${coupon.expiredDate != null}" th:text="${#temporals.format(coupon.expiredDate, 'yyyy.MM.dd HH:mm')}"></span>
                            <span th:unless="${coupon.expiredDate != null}">-</span>
                        </td>
                        <td>
                            <span th:if="${coupon.usedDate != null}" th:text="${#temporals.format(coupon.usedDate, 'yyyy.MM.dd HH:mm')}"></span>
                            <span th:unless="${coupon.usedDate != null}">-</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- If no coupons are available -->
            <div th:if="${#lists.isEmpty(userAndCoupon)}">
                <p>No coupons found.</p>
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center mt-4">
                    <!-- 첫번째 페이지로 이동 -->
                    <li class="page-item" th:classappend="${userAndCoupon.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/coupons/users(page=1, size=${userAndCoupon.size}, userId=${param.userId}, type=${param.type})}"
                           aria-label="First">
                            <span aria-hidden="true">&laquo; First</span>
                        </a>
                    </li>

                    <!-- 이전 페이지로 이동 -->
                    <li class="page-item" th:classappend="${userAndCoupon.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/coupons/users(page=${userAndCoupon.number}, size=${userAndCoupon.size}, userId=${param.userId}, type=${param.type})}"
                           aria-label="Previous">
                            <span aria-hidden="true">&lsaquo; Previous</span>
                        </a>
                    </li>


                    <!-- 페이지 번호 링크 -->
                    <li class="page-item" th:each="page: ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${page == userAndCoupon.number + 1} ? 'active'">
                        <a class="page-link"
                           th:href="@{/coupons/users(page=${page}, size=${userAndCoupon.size}, userId=${param.userId}, type=${param.type})}"
                           th:text="${page}"></a>
                    </li>

                    <!-- 다음 페이지로 이동 -->
                    <li class="page-item" th:classappend="${userAndCoupon.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/coupons/users(page=${userAndCoupon.number + 2}, size=${userAndCoupon.size}, userId=${param.userId}, type=${param.type})}"
                           aria-label="Next">
                            <span aria-hidden="true">Next &rsaquo;</span>
                        </a>
                    </li>

                    <!-- 마지막 페이지로 이동 -->
                    <li class="page-item" th:classappend="${userAndCoupon.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/coupons/users(page=${userAndCoupon.totalPages}, size=${userAndCoupon.size}, userId=${param.userId}, type=${param.type})}"
                           aria-label="Last">
                            <span aria-hidden="true">Last &raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </section>
</section>
</section>
<!--=================================
            Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>


<!-- Bootstrap JS and dependencies -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

</body>
</html>
