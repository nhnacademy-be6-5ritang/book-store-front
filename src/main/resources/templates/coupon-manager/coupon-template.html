<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>쿠폰템플릿 관리 페이지</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}"/>
    <style>
        /* 테이블 전체 스타일 */
        #couponTable {
            width: 200%;
            table-layout: fixed; /* 열 너비 고정 */
        }

        /* 테이블 헤더 및 본문 스타일 */
        #couponTable th, #couponTable td {
            vertical-align: middle;
            padding: 0.5rem;
            text-align: center;
            white-space: nowrap; /* 줄 바꿈 방지 */
            overflow: hidden; /* 넘치는 텍스트 숨김 */
            text-overflow: ellipsis; /* 생략 부호 표시 */
        }

        /* 각 열의 비율에 따른 너비 설정 */
        #couponTable th:nth-child(1),
        #couponTable td:nth-child(1) {
            width: 30%; /* 쿠폰 아이디 */
        }

        #couponTable th:nth-child(2),
        #couponTable td:nth-child(2) {
            width: 40%; /* 쿠폰 정책아이디 */
        }

        #couponTable th:nth-child(3),
        #couponTable td:nth-child(3) {
            width: 50%; /* 최소 주문금액 */
        }

        #couponTable th:nth-child(4),
        #couponTable td:nth-child(4) {
            width: 50%; /* 할인 금액 */
        }

        #couponTable th:nth-child(5),
        #couponTable td:nth-child(5) {
            width: 30%; /* 할인률 */
        }

        #couponTable th:nth-child(6),
        #couponTable td:nth-child(6) {
            width: 50%; /* 최대 할인금액 */
        }

        #couponTable th:nth-child(7),
        #couponTable td:nth-child(7) {
            width: 40%; /* 쿠폰 타입 */
        }

        #couponTable th:nth-child(8),
        #couponTable td:nth-child(8) {
            width: 65%; /* 만료일 */
        }

        #couponTable th:nth-child(9),
        #couponTable td:nth-child(9) {
            width: 65%; /* 발행일 */
        }

        #couponTable th:nth-child(10),
        #couponTable td:nth-child(10) {
            width: 46%; /* 쿠폰 정책사용여부 */
        }

        #couponTable th:nth-child(11),
        #couponTable td:nth-child(11) {
            width: 60%; /* 카테고리 이름 */
        }

        #couponTable th:nth-child(12),
        #couponTable td:nth-child(12) {
            width: 60%; /* 도서 이름 */
        }

        #couponTable th:nth-child(13),
        #couponTable td:nth-child(13) {
            width: 30%; /* 쿠폰 수량 */
        }
        /* 사용자 정의 CSS */
        .status-true {
            color: green;
        }
        .status-false {
            color: red;
        }
    </style>
</head>
<body>

<!--=================================
   Header Area
   ===================================== -->

<div th:insert="~{global/header}"></div>
<div class="container">
    <div class="row">
        <div class="col-lg-3 col-12">
            <!-- 사용자 계정 메뉴 -->
            <div th:insert="~{fragments/admin-account-menu.html}"></div>
        </div>
        <div class="col-lg-9 col-12">
    <div class="row mt-4">
        <div class="col-md-12">
            <!-- Display Coupon List -->
            <h4>쿠폰템플릿 목록</h4>
            <table id="couponTable" class="table table-bordered">
                <thead>
                <tr>
                    <th class="narrow-col">쿠폰 아이디</th>
                    <th class="narrow-col">쿠폰 정책아이디</th>
                    <th class="wide-col">최소 주문금액</th>
                    <th class="wide-col">할인 금액</th>
                    <th class="wide-col">할인률</th>
                    <th class="wide-col">최대 할인금액</th>
                    <th class="wide-col">쿠폰 타입</th>
                    <th class="wide-col">만료일</th>
                    <th class="wide-col">발행일</th>
                    <th class="narrow-col">쿠폰 정책사용여부</th>
                    <th class="wide-col">카테고리 이름</th>
                    <th class="wide-col">도서 이름</th>
                    <th class="narrow-col">쿠폰 수량</th>
                </tr>
                </thead>
                <tbody>
                <div th:if="${#lists.isEmpty(couponTemplates)}">
                    <p>현재 발급가능한 쿠폰이 없습니다.</p>
                </div>
                <!-- Loop through coupons and display each coupon -->
                <tr th:each="coupon : ${coupons}">
                    <td class="narrow-col">
                        <input type="text" class="form-control" th:value="${coupon.id != null ? coupon.id : '-'}" readonly>
                    </td>
                    <td class="narrow-col">
                        <input type="text" class="form-control" th:value="${coupon.couponPolicyId != null ? coupon.couponPolicyId : '-'}" readonly>
                    </td>

                    <td class="wide-col">
                        <input type="text" class="form-control"
                               th:value="${coupon.minOrderPrice != null ? #numbers.formatDecimal(coupon.minOrderPrice,1,'COMMA', 0, 'POINT')+'원' : '-'}"
                               readonly>
                    </td>
                    <td class="wide-col">
                        <input type="text" class="form-control"
                               th:value="${coupon.salePrice != null ? #numbers.formatDecimal(coupon.salePrice, 1, 'COMMA', 0, 'POINT')+'원' : '-'}"
                               readonly>
                    </td>
                    <td class="wide-col">
                        <input type="text" class="form-control"
                               th:value="${coupon.saleRate != null ? #numbers.formatDecimal(coupon.saleRate * 100, 1, 'COMMA', 0, 'POINT') + '%' : '-'}"
                               readonly>
                    </td>
                    <td class="wide-col">
                        <input type="text" class="form-control"
                               th:value="${coupon.maxSalePrice != null ? #numbers.formatDecimal(coupon.maxSalePrice, 1, 'COMMA', 0, 'POINT')+'원' : '-'}"
                               readonly>
                    </td>
                    <td class="wide-col">
                        <input type="text" class="form-control" th:value="${coupon.type != null ? coupon.type : '-'}" readonly>
                    </td>

                    <td class="wide-col">
                        <input type="text" class="form-control" th:value="${coupon.expiredDate != null ? #temporals.format(coupon.expiredDate, 'yyyy-MM-dd HH:mm') : '-'}" readonly>
                    </td>
                    <td class="wide-col">
                        <input type="text" class="form-control" th:value="${coupon.issueDate != null ? #temporals.format(coupon.issueDate, 'yyyy-MM-dd HH:mm') : '-'}" readonly>
                    </td>
                    <td class="narrow-col">
                        <input type="text" class="form-control status-true" th:if="${coupon.isUsed}" th:value="'사용'" readonly>
                        <input type="text" class="form-control status-false" th:if="${!coupon.isUsed}" th:value="'폐기'" readonly>
                    </td>
                    <td class="wide-col">
                        <input type="text" class="form-control" th:value="${coupon.categoryName != null ? coupon.categoryName : '-'}" th:if="${coupon.type == 'category'}">
                    </td>
                    <td class="wide-col">
                        <input type="text" class="form-control" th:value="${coupon.bookTitle != null ? coupon.bookTitle : '-'}" th:if="${coupon.type == 'book'}">
                    </td>
                    <td class="narrow-col">
                        <input type="text" class="form-control" th:value="${coupon.quantity != null ? coupon.quantity : '-'}" readonly>
                    </td>
                </tr>
                </tbody>
            </table>


            <div th:insert="~{global/paging}"></div>

        </div>
    </div>
        </div>
    </div>

</div>
<!--=================================
            Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>
</body>
</html>
