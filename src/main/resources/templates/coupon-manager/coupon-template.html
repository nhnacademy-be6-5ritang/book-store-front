<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>쿠폰템플릿 관리 페이지</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}"/>
</head>
<body>

<!--=================================
   Header Area
   ===================================== -->

<div th:insert="~{global/header}"></div>
<div class="container">
    <div class="row mt-4">
        <div class="col-md-12">
            <!-- Display Coupon List -->
            <h4>Coupon List</h4>
            <table id="couponTable" class="table table-bordered">
                <thead>
                <tr>
                    <th>Coupon ID</th>
                    <th>Coupon PolicyId</th>
                    <th>Min Order Price</th>
                    <th>Sale Price</th>
                    <th>Sale Rate</th>
                    <th>Max Sale Price</th>
                    <th>Type</th>
                    <th>Expired Date</th>
                    <th>Issue Date</th>
                    <th>Coupon Policy isUsed</th>
                    <th>Category Coupon Name</th>
                    <th>Book Coupon Title</th>
                </tr>
                </thead>
                <tbody>
                <!-- Loop through coupons and display each coupon -->
                <tr th:each="coupon : ${coupons}">
                    <td><input type="text" class="form-control couponId" th:value="${coupon.id}" readonly></td>
                    <td>
                        <input type="text" class="form-control couponPolicyId" th:value="${coupon.couponPolicyId}"
                               readonly>
                    </td>
                    <td>
                        <input type="text" class="form-control minOrderPrice" th:value="${coupon.minOrderPrice}"
                               readonly>
                    </td>
                    <td>
                        <input type="text" class="form-control salePrice" th:value="${coupon.salePrice}" readonly>
                    </td>
                    <td>
                        <input type="text" class="form-control saleRate" th:value="${coupon.saleRate}" readonly>
                    </td>
                    <td>
                        <input type="text" class="form-control maxSalePrice" th:value="${coupon.maxSalePrice}" readonly>
                    </td>
                    <td>
                        <input type="text" class="form-control type" th:value="${coupon.type}" readonly>
                    </td>
                    <td><input type="text" class="form-control expiredDate" th:value="${coupon.expiredDate}"></td>
                    <td><input type="text" class="form-control issueDate" th:value="${coupon.issueDate}"></td>
                    <td><input type="text" class="form-control isUsed" th:value="${coupon.isUsed}"></td>
                    <td><input type="text" class="form-control categoryName" th:value="${coupon.categoryName}"></td>
                    <td><input type="text" class="form-control bookTitle" th:value="${coupon.bookTitle}"></td>
                </tr>
                </tbody>
            </table>


            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center mt-4">
                    <!-- 첫번째 페이지로 이동 -->
                    <li class="page-item" th:classappend="${coupons.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/coupons(page=1, size=${coupons.size})}" aria-label="First">
                            <span aria-hidden="true">&laquo; First</span>
                        </a>
                    </li>


                    <li class="page-item" th:classappend="${coupons.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="${coupons.first} ? '#' : '/coupons?page=' + ${coupons.number}+'&size='+${coupons.size}"
                           aria-label="Previous">
                            <span aria-hidden="true">&lsaquo; Previous</span>
                        </a>
                    </li>

                    <!-- 페이지 번호 링크 -->
                    <li class="page-item" th:each="page: ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${page == coupons.number + 1} ? 'active'">
                        <a class="page-link" th:href="@{/coupons(page=${page}, size=${coupons.size})}"
                           th:text="${page}"></a>
                    </li>

                    <!-- 다음 페이지로 이동  둘다 가능한 방법 -->
                    <li class="page-item" th:classappend="${coupons.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="${coupons.last} ? '#' : '/coupons?page=' + (${coupons.number} + 2)+'&size='+${coupons.size}"
                           aria-label="Next">
                            <span aria-hidden="true">Next &rsaquo;</span>
                        </a>
                    </li>

                    <!-- 마지막 페이지로 이동 -->
                    <li class="page-item" th:classappend="${coupons.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/coupons(page=${coupons.totalPages}, size=${coupons.size})}"
                           aria-label="Last">
                            <span aria-hidden="true">Last &raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>

</div>
<!--=================================
            Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>
</body>
</html>
