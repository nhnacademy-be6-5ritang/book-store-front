<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>포인트 내역 조회</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <div th:if="${pointTransactions != null}">
                <table class="table">
                    <!-- Head Row -->
                    <thead>
                    <tr>
                        <th class="pro-user">유저 아이디</th>
                        <th class="pro-policy">포인트 정책 아이디</th>
                        <th class="pro-amount">포인트 내역</th>
                        <th class="pro-date">날짜</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Product Row -->
                    <tr th:each="point : ${pointTransactions}" class="order-item">
                        <td class="pro-user">
                            <span th:text="${point.userId()}"></span>
                        </td>
                        <td class="pro-policy"> <span
                                th:text="${point.policyId()}"></span></td>
                        <td class="pro-amount"><span
                                th:text="${point.amount().setScale(0)} + 원"></span></td>
                        <td class="pro-date"><span
                                th:text="${point.date()}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <!-- 페이징 처리 시작-->
            <div th:insert="~{global/paging.html}"></div>
            <!-- 페이징 처리 끝-->
            <div th:if="${pointTransactions == null}">
                <p>포인트 내역이 없습니다.</p>
            </div>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>
<footer th:insert="~{global/footer}"></footer>
<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
