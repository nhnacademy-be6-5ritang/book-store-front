<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/favicon.ico}">
</head>


<body>
<div class="site-wrapper" id="top">
    <!--=================================
    Header Area
    ===================================== -->
    <div th:insert="~{global/header}"></div>

    <section class="breadcrumb-section">
        <h2 class="sr-only">Site Breadcrumb</h2>
        <div class="container">
            <div class="breadcrumb-contents">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/api/categories/main}">홈</a></li>
                        <li class="breadcrumb-item active">포인트 내역 조회</li>
                    </ol>
                </nav>
            </div>
        </div>
    </section>

    <div class="page-section inner-page-sec-padding">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="row">
                        <!-- My Account Tab Menu Start -->
                        <div class="col-lg-3 col-12">
                            <!-- 관리자 계정 메뉴 -->
                            <div th:insert="~{fragments/admin-account-menu.html}"></div>
                        </div>
                        <!-- My Account Tab Menu End -->
                        <!-- My Account Tab Content Start -->
                        <div class="col-lg-9 col-12 mt--30 mt-lg--0">
                            <div class="tab-content" id="myaccountContent">
                                <div class="cart_area inner-page-sec-padding-bottom">
                                    <div class="container">
                                        <div class="page-section-title">
                                            <h1>포인트 내역 조회</h1>
                                        </div>
                                        <div th:if="${pointTransactions != null}">
                                            <div th:each="point : ${pointTransactions}" class="order-item">
                                                <table class="table">
                                                    <!-- Head Row -->
                                                    <thead>
                                                    <tr>
                                                        <th class="pro-user">유저 아이디</th>
                                                        <th class="pro-policy">포인트 정책 아이디</th>
                                                        <th class="pro-amount">포인트 내역</th>
                                                        <th class="pro-date">날짜</th>
                                                    </tr>
                                                    </thead>
                                                    <tbody>
                                                    <!-- Product Row -->
                                                    <tr>
                                                        <td class="pro-user">
                                                                <span th:text="${point.userId()}"></span>
                                                        </td>
                                                        <td class="pro-policy"> <span
                                                                th:text="${point.policyId()}"></span></td>
                                                        <td class="pro-amount"><span
                                                                th:text="${point.amount()}"></span></td>
                                                        <td class="pro-date"><span
                                                                th:text="${point.date()}"></span></td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                            <!-- 페이징 처리 시작-->
                                            <div th:insert="~{global/paging.html}"></div>
                                            <!-- 페이징 처리 끝-->
                                        </div>
                                        <div th:if="${pointTransactions == null}">
                                            <p>포인트 내역이 없습니다.</p>
                                        </div>
                                    </div>
                                </div>

                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!--=================================
Footer Area
===================================== -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
</body>

</html>
