<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>포인트 정책</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <div th:if="${policies != null}">
                <table class="table">
                    <!-- Head Row -->
                    <thead>
                    <tr>
                        <th class="pro-title">포인트 정책 아이디</th>
                        <th class="pro-type">포인트 정책 타입</th>
                        <th class="pro-price">포인트 정책 가격</th>
                        <th class="pro-status">포인트 정책 상태</th>
                        <th class="pro-action">액션</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Product Row -->
                    <tr th:each="policy : ${policies}" class="order-item">
                        <td class="pro-price"> <span
                                th:text="${policy.pointEarningPolicyId()}"></span></td>
                        <td class="pro-type"><span
                                th:text="${policy.pointEarningPolicyType()}"></span>
                        </td>
                        <td class="pro-price"><span
                                th:text="${policy.pointEarningAmount()}"></span></td>
                        <td class="pro-status"><span
                                th:text="${policy.pointEarningPolicyStatus()}"></span>
                        </td>
                        <td class="pro-action">
                            <a th:if="${policy.pointEarningPolicyStatus() == 'ACTIVE'}"
                               th:href="@{/api/point-earning-policies/admin/{policyId}/deactivate(policyId=${policy.pointEarningPolicyId()})}">
                                <button class="btn btn-danger">비활성화</button>
                            </a>
                            <a th:if="${policy.pointEarningPolicyStatus() == 'DORMANT'}"
                               th:href="@{/api/point-earning-policies/admin/{policyId}/active(policyId=${policy.pointEarningPolicyId()})}">
                                <button class="btn btn-success">활성화</button>
                            </a>
                            <a th:href="@{/api/point-earning-policies/admin/{policyId}(policyId=${policy.pointEarningPolicyId()})}">
                                <button class="btn btn-primary">수정</button>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <a th:href="@{/api/point-earning-policies/admin/create}">
                <button class="btn btn-primary">새 포인트 정책 생성</button>
            </a>
            <div th:if="${policies == null}">
                <p>주문 목록이 없습니다.</p>
            </div>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>
<footer th:insert="~{global/footer}"></footer>
<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
