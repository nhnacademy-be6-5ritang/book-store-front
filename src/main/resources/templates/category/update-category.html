<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">카테고리</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <h3>카테고리 수정 폼</h3>
            <form th:action="@{/api/categories/{categoryId} (categoryId=${category.categoryId})}"
                  th:method="put" th:object="${category}">
                <div class="form-group">
                    <label for="categoryName">카테고리 이름</label>
                    <input type="text" class="form-control" id="categoryName"
                           th:field="*{categoryName}" required>
                </div>
                <div class="form-group">
                    <label for="parentCategoryId">상위 카테고리</label>
                    <select class="form-control" id="parentCategoryId"
                            name="parentCategoryId">
                        <option value="" th:text="'없음'">없음</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.categoryId}"
                                th:text="${cat.categoryName}"
                                th:selected="${cat.categoryName.equals(category.parentCategoryName)}">
                            카테고리 선택
                        </option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">수정</button>
                <a class="btn btn-secondary" onclick="history.back()">취소</a>
            </form>
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
