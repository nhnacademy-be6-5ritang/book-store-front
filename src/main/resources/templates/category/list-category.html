<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">카테고리</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <h3>카테고리 리스트</h3>
            <h3><a th:href="@{/api/categories/create}" class="btn btn-primary">카테고리 추가</a></h3>
            <div th:if="${categories.getContent().size() > 0}">
                <table class="table table-bordered">
                    <thead>
                    <tr class="inline-text">
                        <th>번호</th>
                        <th>상위 카테고리 이름</th>
                        <th>카테고리 이름</th>
                        <td></td>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category, index : ${categories}">
                        <td th:text="${index.index + 1 + (pageable.pageNumber - 1) * pageable.pageSize}">
                            1
                        </td>
                        <td th:text="${category.parentCategoryName}">상위 카테고리 이름</td>
                        <td th:text="${category.categoryName}">카테고리 이름</td>
                        <td style="display: flex; align-items: center;">
                            <a th:href="@{/api/categories/update/{categoryId} (categoryId=${category.categoryId})}"
                               class="btn btn-warning">편집</a>
                            <form th:action="@{/api/categories/{categoryId} (categoryId=${category.categoryId})}"
                                  th:method="delete">
                                <button type="submit" class="btn btn-danger">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${categories.getContent().size() == 0}">
                <p>카테고리가 없습니다.</p>
            </div>
            <!-- 페이징 처리 시작-->
            <div th:insert="~{global/paging.html}"></div>
            <!-- 페이징 처리 끝-->
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
