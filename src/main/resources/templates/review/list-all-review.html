<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" th:href="@{/css/pages/list-review-by-user.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">리뷰</h5>
        </section>
        <section id="page-body">
            <h3>리뷰 리스트</h3>
            <div th:if="${reviews.getContent().size() > 0}">
                <div class="review-list">
                    <div class="tabs">
                        <button class="active">전체 리뷰 (<span
                                th:text="${reviews.getContent().size()}"></span>)
                        </button>
                        <button>일반 리뷰 (2)</button>
                        <button>포토 리뷰 (1)</button>
                    </div>
                    <div th:each="review : ${reviews}" class="review">
                        <div class="review-header">
                            <div class="info">
                                <span th:text="${review.userId}"></span>
                                <span th:text="${review.reviewCreatedAt}"></span>
                                <span th:each="star : ${#numbers.sequence(1, review.reviewScore)}"
                                      class="star">&#9733;</span>
                                <span th:if="${review.reviewScore < 5}"
                                      th:each="star : ${#numbers.sequence(1, 5 - review.reviewScore)}"
                                      class="star">&#9734;</span>
                            </div>
                        </div>
                        <div class="review-body">
                            <span th:text="${review.reviewComment}"></span>
                            <span class="more">더보기</span>
                        </div>
                    </div>
                    <!-- 페이징 처리 시작-->
                    <div th:insert="~{global/paging.html}"></div>
                    <!-- 페이징 처리 끝-->
                </div>
            </div>
            <div th:if="${reviews.getContent().size() == 0}">
                <div class="review-list">
                    <div class="tabs">
                        <button class="active">전체 리뷰 (0)</button>
                        <button>일반 리뷰 (0)</button>
                        <button>포토 리뷰 (0)</button>
                    </div>
                </div>
            </div>
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
