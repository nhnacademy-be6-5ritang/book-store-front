<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>마이페이지 쿠폰</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/coupon/coupon.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}"/>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/user-menu}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5>내 쿠폰함</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <section th:each="coupon : ${userAndCoupon}" class="col-md-6 mb-4">
                <section class="card">
                    <section class="card-body">
                        <p class="card-text">쿠폰 타입:
                            <span th:if="${coupon.type != null}" th:text="${coupon.type}"></span>
                            <span th:unless="${coupon.type != null}">-</span>
                        </p>
                        <!-- Category type 처리 -->
                        <section th:if="${coupon.type == 'category'}">
                            <p class="card-text">카테고리 이름:
                                <span th:if="${coupon.categoryName != null}"
                                      th:text="${coupon.categoryName}"></span>
                                <span th:unless="${coupon.categoryName != null}">-</span>
                            </p>
                        </section>
                        <section th:if="${coupon.type == 'book'}">
                            <p class="card-text">도서 제목:
                                <span th:if="${coupon.bookTitle != null}" th:text="${coupon.bookTitle}"></span>
                                <span th:unless="${coupon.bookTitle != null}">-</span>
                            </p>
                        </section>

                        <section>
                            <!-- 할인 금액이 있을 때 -->
                            <p class="card-text discount-price" th:if="${coupon.salePrice != null}">
                                할인 금액: <span
                                    th:text="${#numbers.formatDecimal(coupon.salePrice, 1, 'COMMA', 0, 'POINT')+'원'}"></span>
                            </p>

                            <!-- 할인 금액이 없을 때 -->
                            <section th:unless="${coupon.salePrice != null}">
                                <p class="card-text">할인 율:
                                    <span th:if="${coupon.saleRate != null}"
                                          th:text="${#numbers.formatDecimal(coupon.saleRate * 100, 1, 'COMMA', 0, 'POINT')+'%'}"></span>
                                    <span th:unless="${coupon.saleRate != null}">-</span>
                                </p>
                                <p class="card-text max-discount">최대 할인금액:
                                    <span th:if="${coupon.maxSalePrice != null}"
                                          th:text="${#numbers.formatDecimal(coupon.maxSalePrice, 1, 'COMMA', 0, 'POINT')+'원'}"></span>
                                    <span th:unless="${coupon.maxSalePrice != null}">-</span>
                                </p>
                            </section>
                        </section>

                        <p class="card-text min-order-price">최소 주문금액:
                            <span th:if="${coupon.minOrderPrice != null}"
                                  th:text="${#numbers.formatDecimal(coupon.minOrderPrice, 1, 'COMMA', 0, 'POINT')+'원'}"></span>
                            <span th:unless="${coupon.minOrderPrice != null}">-</span>
                        </p>

                        <!-- 정책 사용 여부와 쿠폰 사용 여부 묶어서 표시 -->
                        <p class="card-text coupon-status">쿠폰 사용 여부:
                            <span th:if="${coupon.isUsed != null}"
                                  th:text="${coupon.isUsed ? '사용함' : '사용 안 함'}"></span>
                            <span th:unless="${coupon.isUsed != null}">-</span>
                        </p>

                        <p class="card-text expiry-date">쿠폰 만료일:
                            <span th:if="${coupon.expiredDate != null}"
                                  th:text="${#temporals.format(coupon.expiredDate, 'yyyy.MM.dd HH:mm')}"></span>
                            <span th:unless="${coupon.expiredDate != null}">-</span>
                        </p>

                    </section>
                </section>
            </section>
        </section>
    </section>
</section>

<div th:insert="~{fragments/to-admin-button}"></div>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

</body>
</html>
