<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>쿠폰발행페이지-고객</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/pages/usercoupon-issue-page.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}"/>

</head>
<body>


<!--=================================-->
<!--   Header Area-->
<!--   =====================================-->

<div th:insert="~{global/header}"></div>

<div class="container">
    <div class="row mt-4">
        <div class="col-md-12">
            <h4>발행가능 쿠폰리스트</h4>
            <div class="d-flex flex-wrap justify-content-between">
                <div class="row w-100" th:each="coupontemplate : ${coupontemplates}">
                    <div class="col-md-6 d-flex mb-4">
                        <div class="coupon-card card w-100">
                            <div class="card-body coupon-card-body">
                                <div class="coupon-field">
                                    <label for="couponId-${coupon.id}">Coupon ID</label>
                                    <input type="text" id="couponId-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.id}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="couponPolicyId-${coupon.id}">Coupon PolicyId</label>
                                    <input type="text" id="couponPolicyId-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.couponPolicyId}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="minOrderPrice-${coupon.id}">Min Order Price</label>
                                    <input type="text" id="minOrderPrice-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.minOrderPrice}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="salePrice-${coupon.id}">Sale Price</label>
                                    <input type="text" id="salePrice-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.salePrice}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="saleRate-${coupon.id}">Sale Rate</label>
                                    <input type="text" id="saleRate-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.saleRate}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="maxSalePrice-${coupon.id}">Max Sale Price</label>
                                    <input type="text" id="maxSalePrice-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.maxSalePrice}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="type-${coupon.id}">Type</label>
                                    <input type="text" id="type-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.type}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="expiredDate-${coupon.id}">Expired Date</label>
                                    <input type="text" id="expiredDate-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.expiredDate}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="issueDate-${coupon.id}">Issue Date</label>
                                    <input type="text" id="issueDate-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.issueDate}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="isUsed-${coupon.id}">CouponPolicy Used</label>
                                    <input type="text" id="isUsed-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.isUsed}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="bookTitle-${coupon.id}">book Title</label>
                                    <input type="text" id="bookTitle-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.bookTitle}" readonly>
                                </div>
                                <div class="coupon-field">
                                    <label for="categoryName-${coupon.id}">Category Name</label>
                                    <input type="text" id="categoryName-${coupon.id}" class="form-control"
                                           th:value="${coupontemplate.categoryName}" readonly>
                                </div>
                            </div>
                            <div class="card-footer issue-btn">
                                <form th:action="@{/coupons/{couponTemplateId}(couponTemplateId=${coupontemplate.id})}"
                                      th:method="post">
                                    <button type="submit" class="btn btn-primary">발급</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 한 줄에 2개의 쿠폰 카드가 나란히 표시됩니다 -->
            </div>

            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center mt-4">
                    <!-- 첫번째 페이지로 이동 -->
                    <li class="page-item" th:classappend="${coupontemplates.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/coupons/issue(page=1, size=${coupontemplates.size})}"
                           aria-label="First">
                            <span aria-hidden="true">&laquo; First</span>
                        </a>
                    </li>


                    <li class="page-item" th:classappend="${coupontemplates.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="${coupontemplates.first} ? '#' : '/coupons/issue?page=' + ${coupontemplates.number}+'&size='+${coupontemplates.size}"
                           aria-label="Previous">
                            <span aria-hidden="true">&lsaquo; Previous</span>
                        </a>
                    </li>


                    <!-- 페이지 번호 링크 -->
                    <li class="page-item" th:each="page: ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${page == coupontemplates.number + 1} ? 'active'">
                        <a class="page-link" th:href="@{/coupons/issue(page=${page}, size=${coupontemplates.size})}"
                           th:text="${page}"></a>
                    </li>


                    <!-- 다음 페이지로 이동  둘다 가능한 방법 -->
                    <li class="page-item" th:classappend="${coupontemplates.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="${coupontemplates.last} ? '#' : '/coupons/issue?page=' + (${coupontemplates.number} + 2)+'&size='+${coupontemplates.size}"
                           aria-label="Next">
                            <span aria-hidden="true">Next &rsaquo;</span>
                        </a>
                    </li>


                    <!-- 마지막 페이지로 이동 -->
                    <li class="page-item" th:classappend="${coupontemplates.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/coupons/issue(page=${coupontemplates.totalPages}, size=${coupontemplates.size})}"
                           aria-label="Last">
                            <span aria-hidden="true">Last &raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>


        </div>
    </div>
</div>

<!--=================================-->
<!--            Footer Area-->
<!--=====================================-->
<div th:insert="~{global/footer}"></div>

</body>
</html>
