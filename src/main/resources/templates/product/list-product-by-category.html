<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/pages/list-book-by-category.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section class="page-section inner-page-sec-padding">
    <div class="top-container book-list-container">
        <h3 style="color: darkgreen; font-weight: bold;" th:text="'카테고리: ' + ${categoryName}"></h3>
        <section>
            <form th:action="@{/products/category}" method="get">
                <input type="hidden" name="categoryName" th:value="${categoryName}">
                <!-- 정렬 방식 선택 -->
                <label for="direction">정렬 방식:</label>
                <select id="direction" name="direction">
                    <option value="DESC" th:selected="${direction == 'DESC'}">내림차순</option>
                    <option value="ASC" th:selected="${direction == 'ASC'}">오름차순</option>
                </select>

                <!-- 정렬 기준 선택 -->
                <label for="sortBy">기준 선택:</label>
                <select id="sortBy" name="sortBy">
                    <option value="bookPublishDate" th:selected="${sortBy == 'bookPublishDate'}">책 출판일</option>
                    <option value="authorName" th:selected="${sortBy == 'authorName'}">저자</option>
                    <option value="publisherName" th:selected="${sortBy == 'publisherName'}">출판사</option>
                    <option value="bookStatusName" th:selected="${sortBy == 'bookStatusName'}">책 상태</option>
                    <option value="bookTitle" th:selected="${sortBy == 'bookTitle'}">책 제목</option>
                    <option value="bookQuantity" th:selected="${sortBy == 'bookQuantity'}">책 수량</option>
                    <option value="bookIsbn" th:selected="${sortBy == 'bookIsbn'}">책 ISBN</option>
                    <option value="bookPrice" th:selected="${sortBy == 'bookPrice'}">책 가격</option>
                    <option value="bookSalePrice" th:selected="${sortBy == 'bookSalePrice'}">책 세일 가격</option>
                    <option value="bookSalePercent" th:selected="${sortBy == 'bookSalePercent'}">책 세일 비율</option>
                </select>

                <button type="submit" class="sort-btn">정렬하기</button>
            </form>
        </section>


        <div class="book-grid">
            <div th:each="product : ${products}" class="main-page-book"
                 th:data-href="@{/products/{bookId}(bookId=${product.bookId})}"
                 onclick="location.href=this.getAttribute('data-href');">
                <div class="book-thumbnail-container">
                    <img class="book-background-thumbnail" th:src="${product.bookImageUrl}"
                         th:alt="${product.bookTitle}">
                    <img class="book-front-thumbnail" th:src="${product.bookImageUrl}"
                         th:alt="${product.bookTitle}">
                </div>
                <div class="book-info">
                    <h5 class="book-title">
                        <span th:text="${product.bookTitle}" class="book-title-link">제목 없음</span>
                    </h5>
                    <span th:text="${product.authorName}" class="book-author">작가 없음</span>
                    <div class="price-info">
                        <span class="book-price"
                              th:text="${#numbers.formatDecimal(product.bookSalePrice, 1, 'COMMA', 0, 'POINT') + '원'}">가격 정보 없음₩</span>
                        <div class="original-price-info">
                            <del class="book-original-price"
                                 th:text="${#numbers.formatDecimal(product.bookPrice, 1, 'COMMA', 0, 'POINT') + '원'}"></del>
                            <span class="book-price-discount"
                                  th:text="${'-' + #numbers.formatDecimal(product.bookSalePercent, 1, 'COMMA', 0, 'POINT') + '%'}">할인율 정보 없음</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 페이징 처리 시작 -->
        <div th:insert="~{global/paging.html}"></div>
        <!-- 페이징 처리 끝 -->
    </div>
</section>

<footer th:insert="~{global/footer.html}"></footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:src="@{/js/create-wishList.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>
</body>

</html>
