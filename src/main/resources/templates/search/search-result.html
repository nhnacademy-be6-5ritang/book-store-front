<!DOCTYPE html>
<html lang="zxx">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집 - 검색 결과</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/pages/list-book-by-category.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>

<header th:insert="~{global/header}"></header>

<!-- Search Result Section -->
<section class="page-section inner-page-sec-padding">
    <div class="top-container book-list-container">
        <h2 class="search-title" th:text="'검색: ' + ${query}"></h2>

        <section class="sort-section">
            <form th:action="@{/api/search}" method="get" id="sortForm">
                <input type="hidden" name="searchType" th:value="${searchType}">
                <input type="hidden" name="query" th:value="${query}">
                <label for="direction">정렬 방식:</label>
                <select id="direction" name="direction" onchange="sortResults()">
                    <option value="DESC" th:selected="${direction == 'DESC'}">내림차순</option>
                    <option value="ASC" th:selected="${direction == 'ASC'}">오름차순</option>
                </select>

                <label for="sortBy">기준 선택:</label>
                <select id="sortBy" name="sortBy" onchange="sortResults()">
                    <option value="authorName" th:selected="${sortBy == 'authorName'}">저자</option>
                    <option value="bookTitle" th:selected="${sortBy == 'bookTitle'}">책 제목</option>
                    <option value="bookSalePrice" th:selected="${sortBy == 'bookSalePrice'}">책 가격</option>
                </select>
            </form>
        </section>

        <div class="book-grid" id="bookGrid">
            <div th:each="book : ${searchResults}" class="main-page-book"
                 th:data-href="@{/api/books/{bookId}(bookId=${book.bookId})}"
                 onclick="location.href=this.getAttribute('data-href');">
                <div class="book-thumbnail-container">
                    <img class="book-background-thumbnail" th:src="${book.bookImageUrl}"
                         th:alt="${book.bookTitle}">
                    <img class="book-front-thumbnail" th:src="${book.bookImageUrl}"
                         th:alt="${book.bookTitle}">
                </div>
                <div class="book-info">
                    <h5 class="book-title">
                        <span th:text="${book.bookTitle}" class="book-title-link">제목 없음</span>
                    </h5>
                    <span th:text="${book.authorName}" class="book-author">작가 없음</span>
                    <div class="price-info">
                        <span class="book-price"
                              th:text="${#numbers.formatDecimal(book.bookSalePrice, 1, 'COMMA', 0, 'POINT') + '원'}">가격 정보 없음₩</span>
                        <div class="original-price-info">
                            <del class="book-original-price"
                                 th:text="${#numbers.formatDecimal(book.bookPrice, 1, 'COMMA', 0, 'POINT') + '원'}"></del>
                            <span class="book-price-discount"
                                  th:text="${'-' + #numbers.formatDecimal(book.bookSalePercent, 1, 'COMMA', 0, 'POINT') + '%'}">할인율 정보 없음</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:insert="~{global/paging.html}"></div>
    </div>
</section>

<footer th:insert="~{global/footer}"></footer>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-wishList.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>

<script>
    function sortResults() {
        var sortBy = document.getElementById("sortBy").value;
        var direction = document.getElementById("direction").value;
        var bookGrid = document.getElementById("bookGrid");
        var books = Array.from(bookGrid.getElementsByClassName("main-page-book"));

        books.sort(function(a, b) {
            var aValue, bValue;

            switch (sortBy) {
                case 'authorName':
                    aValue = a.querySelector('.book-author').textContent.toLowerCase();
                    bValue = b.querySelector('.book-author').textContent.toLowerCase();
                    break;
                case 'bookTitle':
                    aValue = a.querySelector('.book-title-link').textContent.toLowerCase();
                    bValue = b.querySelector('.book-title-link').textContent.toLowerCase();
                    break;
                case 'bookSalePrice':
                    aValue = parseFloat(a.querySelector('.book-price').textContent.replace(/[^0-9.-]+/g, ""));
                    bValue = parseFloat(b.querySelector('.book-price').textContent.replace(/[^0-9.-]+/g, ""));
                    break;
                default:
                    return 0;
            }

            if (aValue < bValue) {
                return direction === "ASC" ? -1 : 1;
            }
            if (aValue > bValue) {
                return direction === "ASC" ? 1 : -1;
            }
            return 0;
        });

        // Clear the current book grid
        bookGrid.innerHTML = "";

        // Append sorted books
        books.forEach(function(book) {
            bookGrid.appendChild(book);
        });
    }
</script>

</body>
</html>
