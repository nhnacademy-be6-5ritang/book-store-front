<!DOCTYPE html>
<html lang="zxx">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집 - 검색 결과</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/pages/list-book-by-category.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>
<body>
<div class="site-wrapper" id="top">
    <!-- Header Area -->
    <div th:insert="~{global/header}"></div>

    <!-- Search Result Section -->
    <section class="page-section inner-page-sec-padding">
        <div class="container">
            <h2 class="sr-only">검색 결과</h2>

            <section>
                <form th:action="@{/api/search}" method="get">
                    <input type="hidden" name="searchType" th:value="${searchType}">
                    <input type="hidden" name="query" th:value="${query}">
                    <!-- 정렬 방식 선택 -->
                    <label for="direction">정렬 방식:</label>
                    <select id="direction" name="direction">
                        <option value="DESC" th:selected="${direction == 'DESC'}">내림차순</option>
                        <option value="ASC" th:selected="${direction == 'ASC'}">오름차순</option>
                    </select>

                    <!-- 정렬 기준 선택 -->
                    <label for="sortBy">기준 선택:</label>
                    <select id="sortBy" name="sortBy">
                        <option value="bookPublishDate" th:selected="${sortBy == 'bookPublishDate'}">책 출판일</option>
                        <option value="authorName" th:selected="${sortBy == 'authorName'}">저자</option>
                        <option value="publisherName" th:selected="${sortBy == 'publisherName'}">출판사</option>
                        <option value="bookStatusName" th:selected="${sortBy == 'bookStatusName'}">책 상태</option>
                        <option value="bookTitle" th:selected="${sortBy == 'bookTitle'}">책 제목</option>
                        <option value="bookQuantity" th:selected="${sortBy == 'bookQuantity'}">책 수량</option>
                        <option value="bookIsbn" th:selected="${sortBy == 'bookIsbn'}">책 ISBN</option>
                        <option value="bookPrice" th:selected="${sortBy == 'bookPrice'}">책 가격</option>
                        <option value="bookSalePrice" th:selected="${sortBy == 'bookSalePrice'}">책 세일 가격</option>
                        <option value="bookSalePercent" th:selected="${sortBy == 'bookSalePercent'}">책 세일 비율</option>
                    </select>

                    <button type="submit" class="sort-btn">정렬하기</button>
                </form>
            </section>

            <div class="row">
                <!-- Loop through search results -->
                <div th:each="book : ${searchResults}" class="col-lg-3 col-md-4 col-sm-6">
                    <div class="book-card">
                        <div class="book-header">
                            <h3><a th:href="@{/api/books/{bookId}(bookId=${book.bookId})}"
                                   th:text="${#strings.length(book.bookTitle) > 50 ? #strings.substring(book.bookTitle, 0, 50) + '...' : book.bookTitle}">제목 없음</a></h3>
                        </div>
                        <div class="book-image">
                            <img th:src="${book.bookImageUrl}"
                                 th:alt="${book.bookTitle}"
                                 th:href="@{/api/books/{bookId}(bookId=${book.bookId})}">
                            <div class="hover-contents">
                                <div class="hover-btns">
                                    <a th:attr="data-book-id=${book.bookId}"
                                       class="single-btn add-to-bookCart">
                                        <i class="fas fa-shopping-basket"></i>
                                    </a>
                                    <a th:attr="data-book-id=${book.bookId}"
                                       class="single-btn add-to-wishlist">
                                        <i class="fas fa-heart"></i>
                                    </a>
                                    <a th:href="@{/api/books/{bookId} (bookId=${book.bookId})}"
                                       class="single-btn">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="price-block">
                            <span class="price"
                                  th:text="${book.bookSalePrice} + '₩'">가격 정보 없음₩</span>
                            <del class="price-old" th:text="${book.bookPrice} + '₩'"></del>
                            <span class="price-discount"
                                  th:text="${book.bookSalePercent + '%'}">할인율 정보 없음</span>
                        </div>
                    </div>
                </div>
                <!-- End Loop -->
            </div>

            <!-- Paging Section -->
            <div th:insert="~{global/paging.html}"></div>
            <!-- End Paging Section -->
        </div>
    </section>
    <!-- End Search Result Section -->

</div>
<!-- Footer Area -->
<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-wishList.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>
</body>
</html>
