<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">배송비정책</h5>
        </section>
        <section id="page-body" th:object="${deliveryPolicy}">
            <h3>배송비정책 상세 정보</h3>
            <h5 class="card-title"
                th:text="${deliveryPolicy.deliveryPolicyName}"></h5>
            <p class="card-text"><strong>정책 내용:</strong> <span
                    th:text="${deliveryPolicy.deliveryPolicyContent}"></span>
            </p>
            <p class="card-text"><strong>배송비:</strong> <span
                    th:text="${deliveryPolicy.deliveryPolicyPrice}"></span></p>
            <p class="card-text"><strong>배송비 정책 기준 금액:</strong> <span
                    th:text="${deliveryPolicy.deliveryPolicyStandardPrice}"></span>
            </p>
            <div class="d-flex justify-content-end">
                <a th:href="@{/api/deliveryPolicies/update/{deliveryPolicyId} (deliveryPolicyId=${deliveryPolicy.deliveryPolicyId})}"
                   class="btn btn-warning">편집</a>
                <form th:action="@{/api/deliveryPolicies/{deliveryPolicyId}(deliveryPolicyId=${deliveryPolicy.deliveryPolicyId})}"
                      th:method="delete">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
                <a class="btn btn-secondary" onclick="history.back()">뒤로가기</a>
            </div>
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
