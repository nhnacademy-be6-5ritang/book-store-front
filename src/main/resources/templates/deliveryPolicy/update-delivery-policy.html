<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">배송비정책</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <h3>배송비정책 수정 폼</h3>
            <form th:action="@{/api/deliveryPolicies/{deliveryPolicyId}(deliveryPolicyId=${deliveryPolicy.deliveryPolicyId})}"
                  th:method="put" th:object="${deliveryPolicy}">
                <div class="form-group">
                    <label for="deliveryPolicyName">정책 이름</label>
                    <input type="text" class="form-control" id="deliveryPolicyName"
                           th:field="*{deliveryPolicyName}" required>
                </div>
                <div class="form-group">
                    <label for="deliveryPolicyContent">정책 내용</label>
                    <textarea class="form-control" id="deliveryPolicyContent"
                              th:field="*{deliveryPolicyContent}" rows="4"
                              required></textarea>
                </div>
                <div class="form-group">
                    <label for="deliveryPolicyPrice">배송비</label>
                    <input type="text" class="form-control" id="deliveryPolicyPrice"
                           th:field="*{deliveryPolicyPrice}" required>
                </div>
                <div class="form-group">
                    <label for="deliveryPolicyStandardPrice">정책 기준 가격</label>
                    <input type="text" class="form-control"
                           id="deliveryPolicyStandardPrice"
                           th:field="*{deliveryPolicyStandardPrice}" required>
                </div>
                <button type="submit" class="btn btn-primary">수정</button>
                <a class="btn btn-secondary" onclick="history.back()">취소</a>
            </form>
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<script th:src="@{/js/my-page.js}"></script>
</body>
</html>
