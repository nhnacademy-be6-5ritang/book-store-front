<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/wishlist/wishlist.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}">
</head>

<body>
<div th:insert="~{global/header}"></div>

<br/>

<section id="wishlist" class="top-container">
    <h3 style="color: #797979">내 좋아요</h3>
    <hr style="margin: 2rem 0">
    <div class="wishlist-container">
        <div th:if="${!wishLists.isEmpty()}" th:each="wishlist: ${wishLists}">
            <div class="wishlist-item">
                <div class="wishlist-book">
                    <a th:href="@{/products/{bookId} (bookId=${wishlist.bookId})}">
                        <div class="wishlist-thumbnail">
                            <img class="background-thumbnail" th:src="${wishlist.bookImageUrl}" alt="Book Image">
                            <img class="front-thumbnail" th:src="${wishlist.bookImageUrl}" alt="Book Image">
                        </div>
                    </a>
                    <div class="book-text-info">
                        <a style="font-size: 1rem; font-weight: bold; color: #797979"
                           th:href="@{/products/{bookId} (bookId=${wishlist.bookId})}" th:text="${wishlist.bookTitle}">
                            Book Title
                        </a>
                        <br/>
                        <span style="color: #797979" th:text="${wishlist.authorName}">Author</span>
                        <br/>
                        <span style="color: #797979" th:text="${wishlist.publisherName}">Publisher</span>
                        <br/>
                        <div>
                            <span style="font-size: 1rem; color: #797979">현재가&nbsp;</span>
                            <span style="font-size: 1.1rem; color: #333333"
                                  th:text="${#numbers.formatDecimal(wishlist.bookSalePrice, 1, 'COMMA', 0, 'POINT')+'원'}">Price</span>
                        </div>
                    </div>
                </div>
                <div class="wishlist-item-buttons">
                    <div>
                        <button th:attr="data-book-id=${wishlist.bookId}" class="add-to-bookCart wishlist-cart-button">
                            <i style="font-size: 1.2rem" class="fa-solid fa-shopping-cart"></i>
                            <span>장바구니</span>
                        </button>
                    </div>
                    <form th:action="@{/wish-lists/{wishListsId} (wishListsId=${wishlist.wishListId})}"
                          th:method="delete">
                        <button type="submit" class="wishlist-dump-button">
                            <i style="font-size: 1.2rem" class="fa-solid fa-trash"></i>
                            <span>삭제</span>
                        </button>
                    </form>
                </div>
            </div>
            <hr>
        </div>
        <div th:if="${wishLists.isEmpty()}">
            <p>현재 위시리스트가 비어 있습니다.</p>
        </div>
    </div>
</section>

<br/>
<br/>
<br/>
<br/>

<div th:insert="~{global/footer}"></div>

<!-- Use Minified Plugins Version For Fast Page Load -->
<script th:src="@{/js/plugins.js}"></script>
<script th:src="@{/js/ajax-mail.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/create-bookCart.js}"></script>
</body>

</html>
