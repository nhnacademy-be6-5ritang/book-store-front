<div th:if="${objects.getContent().size() > 0}">
    <ul class="pagination justify-content-center mt-4">
        <!-- 첫번째 페이지로 이동 -->
        <li class="page-item" th:classappend="${objects.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=1)}" aria-label="First">
                <span aria-hidden="true">&laquo; 처음</span>
            </a>
        </li>
        <!-- 이전 페이지로 이동 -->
        <li class="page-item" th:classappend="${objects.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${objects.number})}" aria-label="Previous">
                <span aria-hidden="true">&lsaquo; 이전</span>
            </a>
        </li>
        <!-- 페이지 번호 링크 -->
        <li class="page-item" th:each="page: ${#numbers.sequence(startPage, endPage)}"
            th:classappend="${page == objects.number + 1} ? 'active'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page})}" th:text="${page}"></a>
        </li>
        <!-- 다음 페이지로 이동 -->
        <li class="page-item" th:classappend="${objects.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${objects.number + 2})}" aria-label="Next">
                <span aria-hidden="true">다음 &rsaquo;</span>
            </a>
        </li>
        <!-- 마지막 페이지로 이동 -->
        <li class="page-item" th:classappend="${objects.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${objects.totalPages})}" aria-label="Last">
                <span aria-hidden="true">끝 &raquo;</span>
            </a>
        </li>
    </ul>
</div>
