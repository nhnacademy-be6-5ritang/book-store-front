<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>책 파는 오리탕집</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/plugins.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/common/frame.css}"/>
    <link rel="stylesheet" type="text/css" media="screen" th:href="@{/css/alert-box.css}"/>
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/image/ORITANG_ROUND.png}"/>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"/>
</head>

<body>
<header th:insert="~{global/header}"></header>

<section id="page" class="top-container">
    <section id="page-menu-container" th:insert="~{fragments/admin-menu.html}"></section>
    <section id="page-content">
        <section id="page-header">
            <h5 style="margin: 0 1rem">캐싱 관리</h5>
        </section>
        <hr style="width: 100%"/>
        <section id="page-body">
            <button id="cache-reset-btn" class="btn btn-primary" data-url="/main-page/refresh" data-method="GET">메인 페이지
                캐싱
                초기화
            </button>
        </section>
    </section>
</section>

<footer th:insert="~{global/footer}"></footer>

<!-- 단순 알림 박스 -->
<div id="alertBox" class="alert-box">
    <span class="closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
    <span id="alertMessage"></span>
</div>

<script src="/js/alert-box.js"></script>
<script>
    // 알림 박스를 초기화하고 동적 URL과 메서드를 설정합니다.
    const button = document.getElementById('cache-reset-btn');
    const url = button.getAttribute('data-url');
    const method = button.getAttribute('data-method');
    setupAlertBox(url, method, button.id);
</script>
</body>
</html>
